 jeddah_port_01:0 "Port of Jeddah"
 jeddah_port_01_desc:0 "#F Jeddah has been the port of Mecca since the Caliph Uthman chose it in the year 26 of the Hijra. It is a small walled town on a coast of coral reefs, with little water of its own, but every pilgrim who comes by sea lands here, a day and a night's march from the Holy City, and the grain of Egypt that feeds Mecca comes in over its quays.#!"
 building_jeddah_port_01:0 "$jeddah_port_01$"
 building_jeddah_port_01_desc:0 "$jeddah_port_01_desc$"
