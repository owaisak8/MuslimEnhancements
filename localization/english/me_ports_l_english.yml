 siraf_port_01:0 "Harbour of Siraf"
 siraf_port_01_desc:0 "#F Siraf clings to a narrow strip of shore beneath bare, burning hills, with no fields or gardens worth the name, yet its merchants are among the richest in all the lands of Islam. Their houses rise several storeys high, built of teak brought from India, and from this harbour their ships sail for India and China.#!"
 building_siraf_port_01:0 "$siraf_port_01$"
 building_siraf_port_01_desc:0 "$siraf_port_01_desc$"
 building_type_siraf_port_01:0 "$siraf_port_01$"
 building_type_siraf_port_01_desc:0 "$siraf_port_01_desc$"
 siraf_port_02:0 "Great Emporium of Siraf"
 siraf_port_02_desc:0 "#F Ships from Basra, Oman, India and China crowd the roadstead of Siraf, and its warehouses overflow with spices, aloes, silk and the fine glazed wares of China. Its merchants have grown richer than many princes.#!"
 building_siraf_port_02:0 "$siraf_port_02$"
 building_siraf_port_02_desc:0 "$siraf_port_02_desc$"
