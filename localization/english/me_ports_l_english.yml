 damietta_port_01:0 "Port of Damietta"
 damietta_port_01_desc:0 "#F Damietta stands where the eastern branch of the Nile meets the sea. Its looms and those of nearby Tinnis weave the finest linens of Egypt, sought by caliphs and kings, and its quays send the grain and cloth of the Delta across the sea.#!"
 building_damietta_port_01:0 "$damietta_port_01$"
 building_damietta_port_01_desc:0 "$damietta_port_01_desc$"
 building_type_damietta_port_01:0 "$damietta_port_01$"
 building_type_damietta_port_01_desc:0 "$damietta_port_01_desc$"
 damietta_port_02:0 "Chain Tower of Damietta"
 damietta_port_02_desc:0 "#F On an island in the Nile stands a great tower holding one end of an iron chain stretched across the river to the walls of Damietta. While the tower stands, no enemy fleet can sail up the Nile to the heart of Egypt.#!"
 building_damietta_port_02:0 "$damietta_port_02$"
