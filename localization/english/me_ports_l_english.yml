 port_alexandria_01:0 "The Pharos of Alexandria"
 port_alexandria_01_desc:0 "#F The ancient lighthouse still towers over the entrance to the Eastern Harbour of Alexandria. Its upper storeys have fallen to earthquakes and been rebuilt more than once, but its light still guides ships to the busiest port of Egypt, where the goods of the Indies meet the merchants of the Christian Mediterranean.#!"
 building_port_alexandria_01:0 "$port_alexandria_01$"
 building_port_alexandria_01_desc:0 "$port_alexandria_01_desc$"
 building_type_port_alexandria_01:0 "$port_alexandria_01$"
 building_type_port_alexandria_01_desc:0 "$port_alexandria_01_desc$"
 port_alexandria_02:0 "The Pharos Restored"
 port_alexandria_02_desc:0 "#F At great expense, the Pharos has been restored and strengthened against the earthquakes that have so often shaken it. Once more its fire can be seen far out to sea, and travellers count it again among the wonders of the world.#!"
 building_port_alexandria_02:0 "$port_alexandria_02$"
