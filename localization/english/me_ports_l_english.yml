 ceuta_port_02:0 "Arsenal of Sabta"
 ceuta_port_02_desc:0 "#F The arsenal of Sabta builds and arms the ships that carry armies and merchants across the strait to al-Andalus. Whoever holds Sabta holds the key to the crossing.#!"
