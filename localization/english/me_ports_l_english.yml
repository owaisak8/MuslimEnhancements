 antalya_port_01:0 "Harbour of Antalya"
 antalya_port_01_desc:0 "#F Beneath the Taurus mountains, a small walled harbour shelters the ships that call at Antalya on the way between Constantinople, Cyprus, Syria and Egypt. It is the busiest port on this rugged southern coast of Anatolia.#!"
 building_antalya_port_01:0 "$antalya_port_01$"
 building_antalya_port_01_desc:0 "$antalya_port_01_desc$"
