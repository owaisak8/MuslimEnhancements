 mahdia_port_01_district_desc_flavor:0 "$mahdia_port_01_desc$"

 acre_port_01:0 "Harbour of Acre"
 acre_port_01_desc:0 "#F Two great moles of stone, sunk into the sea on foundations of timber, enclose the harbour of Acre, and a chain across the entrance closes it at night. Ahmad ibn Tulun ordered the work, and it was built by the grandfather of the geographer al-Muqaddasi.#!"
 building_acre_port_01:0 "$acre_port_01$"
 building_acre_port_01_desc:0 "$acre_port_01_desc$"
