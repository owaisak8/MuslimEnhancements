 jeddah_port_02:0 "Harbour of the Pilgrims"
 jeddah_port_02_desc:0 "#F Ships from Aydhab, Aden and the ports of Hind now crowd the harbour of Jeddah, carrying pilgrims to the Hajj and the spices of the Indies on their way to Egypt. The lords of the Hejaz grow rich on the tolls of its customs house, levied on merchant and pilgrim alike.#!"
