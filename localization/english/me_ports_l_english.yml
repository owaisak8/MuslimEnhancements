 ceuta_port_01:0 "Port of Sabta"
 ceuta_port_01_desc:0 "#F Sabta looks across the narrowest part of the strait to al-Andalus. Its fishermen take great tunny in the currents of the strait, and its divers bring up red coral finer than any other, which the craftsmen of the city cut, polish and string for markets across the world.#!"
 building_ceuta_port_01:0 "$ceuta_port_01$"
