 hormuz_port_01_district:0 "$hormuz_port_01$"
 hormuz_port_01_district_desc_flavor:0 "$hormuz_port_01_desc$"

 sohar_port_01:0 "Port of Sohar"
 sohar_port_01_desc:0 "#F Sohar is the greatest town of Oman and the busiest port on the Sea of Persia. Its merchants trade with Iraq, India and China, and from the hills behind it comes copper, smelted in the wadis and carried down to the coast.#!"
 building_sohar_port_01:0 "$sohar_port_01$"
 building_sohar_port_01_desc:0 "$sohar_port_01_desc$"
 building_type_sohar_port_01:0 "$sohar_port_01$"
 building_type_sohar_port_01_desc:0 "$sohar_port_01_desc$"
 sohar_port_02:0 "Emporium of Sohar"
 sohar_port_02_desc:0 "#F Brick and teak houses line the shore of Sohar for miles, around a great mosque whose call to prayer is heard far out to sea. Goods of every land are unloaded here, and the city has grown wealthy enough to be the envy of rulers from Baghdad to Shiraz.#!"
 building_sohar_port_02:0 "$sohar_port_02$"
 building_sohar_port_02_desc:0 "$sohar_port_02_desc$"
