 building_type_antalya_port_01_desc:0 "$antalya_port_01_desc$"
 antalya_port_02:0 "Great Harbour of Antalya"
 antalya_port_02_desc:0 "#F The quays of Antalya are crowded with the ships of Venice, Genoa and Alexandria, unloading spices and cloth for the markets of Anatolia and loading its timber and hides. The city has become the great gateway of Anatolia to the southern sea.#!"
