 hormuz_port_01:0 "Port of Hormuz"
 hormuz_port_01_desc:0 "#F A few miles up a creek from the shore of Mughistan lies Hormuz, the port of Kerman, among its groves of date palms. From here the horses of Persia and Arabia are shipped to the kings of India, who will pay almost any price for them, and the ships return laden with spices and cloth.#!"
 building_hormuz_port_01:0 "$hormuz_port_01$"
 building_hormuz_port_01_desc:0 "$hormuz_port_01_desc$"
 building_type_hormuz_port_01:0 "$hormuz_port_01$"
 building_type_hormuz_port_01_desc:0 "$hormuz_port_01_desc$"
 hormuz_port_02:0 "Customs House of Hormuz"
 hormuz_port_02_desc:0 "#F Every ship that enters the creek of Hormuz now stops at its customs house, where cargoes of horses, spices, pearls and Indian cloth are counted and taxed. The princes of Hormuz have grown rich enough to rule the coasts on both sides of the Gulf, and the trade of Persia, Arabia and India passes through their hands.#!"
 building_hormuz_port_02:0 "$hormuz_port_02$"
 building_hormuz_port_02_desc:0 "$hormuz_port_02_desc$"
