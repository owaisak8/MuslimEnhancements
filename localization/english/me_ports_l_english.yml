 port_alexandria_01_district_desc_flavor:0 "$port_alexandria_01_desc$"

 mahdia_port_01:0 "Port of Mahdia"
 mahdia_port_01_desc:0 "#F On a narrow rocky peninsula, walled from shore to shore, the Fatimid caliph al-Mahdi built his capital. Its harbour is cut into the living rock behind a single entrance that a chain can close, so that no enemy fleet may enter.#!"
 building_mahdia_port_01:0 "$mahdia_port_01$"
 building_mahdia_port_01_desc:0 "$mahdia_port_01_desc$"
 building_type_mahdia_port_01:0 "$mahdia_port_01$"
 building_type_mahdia_port_01_desc:0 "$mahdia_port_01_desc$"
 mahdia_port_02:0 "Arsenal of Mahdia"
 mahdia_port_02_desc:0 "#F Beside the rock-cut harbour stands the arsenal of Mahdia, where galleys are built and armed. From here the fleets of the Fatimids and the Zirids have sailed against Sicily, Egypt and the Christian coasts of the sea.#!"
 building_mahdia_port_02:0 "$mahdia_port_02$"
