 daybul_port_01:0 "Port of Daybul"
 daybul_port_01_desc:0 "#F Daybul lies on a creek of the Indus delta, where ships from Oman, Iraq and the coasts of Hind put in to trade. Here Muhammad ibn al-Qasim brought his siege engines ashore in the year 93 of the Hijra, and it was through this harbour that Islam first came to Sind. Its merchants deal in the cotton cloth of the Indus valley and in horses brought by sea from Arabia and Fars.#!"
 building_daybul_port_01:0 "$daybul_port_01$"
 building_daybul_port_01_desc:0 "$daybul_port_01_desc$"
 building_type_daybul_port_01:0 "$daybul_port_01$"
 building_type_daybul_port_01_desc:0 "$daybul_port_01_desc$"
 daybul_port_02:0 "Gate of Sind"
 daybul_port_02_desc:0 "#F The geographers name Daybul the great port of Sind, and its quays are crowded with the ships of the whole Indian Sea, bringing horses, dates and the goods of Iraq for the markets of Mansura and Multan. Yet the river that feeds its creek is never still, and the silt creeps a little closer to the harbour with every flood.#!"
 building_daybul_port_02:0 "$daybul_port_02$"
