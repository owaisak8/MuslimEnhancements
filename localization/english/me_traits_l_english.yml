 # The Twelfth Imam in occultation (contributed)
 trait_me_twelver_mahdi:0 "The Hidden Imam"
 trait_me_twelver_mahdi_desc:0 "The twelfth Imam of the Twelvers, Muhammad al-Mahdi, is alive but hidden from the world, in occultation (ghayba) by the will of Allah. He holds the Imamate until the day he is permitted to return."
 trait_me_twelver_mahdi_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is the twelfth Imam of the Twelvers, alive but hidden from the world, in occultation (ghayba) by the will of Allah. He holds the Imamate until the day he is permitted to return."
 nick_me_al_mahdi_twelver:0 "al-Mahdi"
 nick_me_al_mahdi_twelver_desc:0 "#F "The Rightly Guided." To the Twelver Shi'a he is the awaited Imam, hidden from the eyes of men and yet living, who will return at the end of days to fill the earth with justice as it has been filled with oppression.#!"
 nick_me_sahib_az_zaman:0 "Sahib az-Zaman"
 nick_me_sahib_az_zaman_desc:0 "The Master of the Age: the Twelfth Imam, hidden from the world, who will return to fill the earth with justice."
 nick_me_al_masuma:0 "al-Ma'suma"
 nick_me_al_masuma_desc:0 "The Immaculate: the name by which the daughter of the seventh Imam has been remembered at her shrine in Qom."
