l_english:
 khewra_salt_mine:0 "The Salt Mines of Khewra"
 khewra_salt_mine_desc:0 "#F Deep in the hills of the Salt Range, galleries cut through seams of rock salt, white, pink and red, thick enough to be quarried like stone. Greek and Roman writers already knew of the salt of these hills, and local tradition holds that the horses of Alexander's army found it by licking the rocks. Through the Middle Ages the mines were worked by the chiefs of the range, and their salt was carried by pack animal to the markets of the Punjab and beyond the Indus.#!"
 building_type_khewra_salt_mine_01:0 "$khewra_salt_mine$"
 building_type_khewra_salt_mine_01_desc:0 "$khewra_salt_mine_desc$"
 khewra_salt_mine_01:0 "Khewra Salt Diggings"
 khewra_salt_mine_01_desc:0 "Men of the hill villages cut rock salt from the outcrops and shallow pits of the hillside, where the seams break the surface. Mules carry it down to the plain a few loads at a time; so far they are only scratching at a mountain of salt."
 building_khewra_salt_mine_01:0 "$khewra_salt_mine_01$"
 building_khewra_salt_mine_01_desc:0 "$khewra_salt_mine_01_desc$"
 khewra_salt_mine_02:0 "Khewra Salt Mine"
 khewra_salt_mine_02_desc:0 "Galleries now run into the hill along the seams, and the miners leave great pillars of salt standing to hold up the roof. Lamps burn in the tunnels day and night, and strings of pack animals wait at the mouth of the mine."
 building_khewra_salt_mine_02:0 "$khewra_salt_mine_02$"
 building_khewra_salt_mine_02_desc:0 "$khewra_salt_mine_02_desc$"
 khewra_salt_mine_03:0 "Great Salt Mine of Khewra"
 khewra_salt_mine_03_desc:0 "The galleries reach deep into the mountain, level beneath level, and whole villages live by cutting, hauling and selling the salt. Caravans carry blocks of it to every market of the Punjab and far beyond the Indus."
 building_khewra_salt_mine_03:0 "$khewra_salt_mine_03$"
 building_khewra_salt_mine_03_desc:0 "$khewra_salt_mine_03_desc$"
 khewra_salt_mine_04:0 "The Salt Mountain of Khewra"
 khewra_salt_mine_04_desc:0 "A maze of tunnels and chambers winds through the heart of the mountain, worked by miners whose skill passes from father to son. No salt mine known to the age can rival it."
 building_khewra_salt_mine_04:0 "$khewra_salt_mine_04$"
 building_khewra_salt_mine_04_desc:0 "$khewra_salt_mine_04_desc$"
 khewra_salt_mine_01_district:0 "$khewra_salt_mine$"
 khewra_salt_mine_01_district_desc_flavor:0 "$khewra_salt_mine_desc$"
