l_english:
 
 ## Main Event
 me_historical_char_creation_events.t.ibn_nusayr: "Echoes of History: Ibn Nusayr"
 me_historical_char_creation_events.t.ishaq_ahmar: "Echoes of History: Ishaq al-Ahmar"
 me_historical_char_creation_events.t.al_jayshani: "Echoes of History: Ibn al-Fadl al-Jayshani"
 me_historical_char_creation_events.t.heresiarch: "Echoes of History: [historical_character.GetFirstNameNicknamedNoTooltip]"
 me_historical_char_creation_events.1.a: "[historical_character_3.GetFirstNameNicknamed] seems to have a bright future..."
 me_hchar_creation_events.desc: "[historical_character.Custom('HistoricalCharacterJobDesc')] known as [historical_character.GetFullNameNicknamed] is reportedly wandering my realm in search of employ. [historical_character.GetSheHe|U] hails from the [birth_location.GetName], and has a certain air about [historical_character.GetHerHim]... [historical_character.Custom('DescriptorPositiveStandalone')] yet somewhat [historical_character.Custom('DescriptorNegativeStandalone')].\n\n\n@historical_character_icon! #weak This character is historical:#!\n#help_light_background [historical_character.Custom('ME_HistoricalCharacterDesc')]#!"
 me_hchar_creation_events_alternative.desc: "[historical_character.Custom('HistoricalCharacterJobDesc')], known as [historical_character.GetFullNameNicknamed], has made a name for [historical_character.GetHerselfHimself] at court. [historical_character.GetSheHe|U] is [historical_character.Custom('DescriptorPositiveStandalone')], and while I cannot put my finger on it, there is something extraordinary about [historical_character.GetHerHim]...\n\n\n@historical_character_icon! #weak This character is historical:#!\n#help_light_background [historical_character.Custom('ME_HistoricalCharacterDesc')]#!"
 me_hchar_creation_events_ibn_nusayr.desc: "A schism has occurred within the [GetFaithByKey('imami').GetAdjective] community as [historical_character.GetFirstNameNicknamed], a man known for his heretical beliefs, has been exiled along with his followers and are now looking for a new place to establish themselves.\n\n\n@historical_character_icon! #weak This character is historical:#!\n#help_light_background [historical_character.Custom('ME_HistoricalCharacterDesc')]#!"
 me_hchar_creation_events_ishaq_ahmar.desc: "It seems yet another schism has occurred within the Shi’ite community, with a man known as [historical_character.GetFirstNameNicknamed] claiming everything that Ibn Nusayr once claimed for himself.\n\n\n@historical_character_icon! #weak This character is historical:#!\n#help_light_background [historical_character.Custom('ME_HistoricalCharacterDesc')]#!"
 me_hchar_creation_events_zakarawayh.desc: "Trouble is brewing, a man by the name of [historical_character.GetFirstNameNicknamed] and his two sons have been propagating a bloodthirsty doctrine that is inciting them to revolt, their steady increase in followers has become a cause for concern among the people of the region.\n\n\n@historical_character_icon! #weak This character is historical:#!\n#help_light_background [historical_character.Custom('ME_HistoricalCharacterDesc')]#!"
 me_hchar_creation_events_al_jayshani.desc: "Two missionaries have appeared in Yemen spreading a religion headed by an Imam who claims descendancy from Isma'il Ibn Ja'far as-Sadiq, they have gathered a few followers and seem to be setting their eyes controlling the region politically as well.\n\n\n@historical_character_icon! #weak This character is historical:#!\n#help_light_background [historical_character.Custom('ME_HistoricalCharacterDesc')]#!"
 me_hchar_creation_events_baqliyyah.desc: "A man has appeared in southern Iraq who is preaching a heresy with strange doctrines, forbidding his followers from slaughtering animals and consuming certain plants.\n\n\n@historical_character_icon! #weak This character is historical:#!\n#help_light_background [historical_character.Custom('ME_HistoricalCharacterDesc')]#!"
 me_hchar_creation_events_heresiarch_tt:0 "[historical_character.GetFullNameNicknamed] has a unique [modifier] that grants [historical_character.GetHerHim] a unique [trait|E] and [doctrine|E] upon creating a new [faith|E]."
 ## Character Description
 historical_character.me_ibn_nusayr: "Muhammad Ibn Nusayr is considered to be the founder of the Nusayriyyah, later on known as the [GetRiteByKey('alawite').GetAdherentNamePlural], he was a follower of [GetFaithByKey('imami').GetAdjective] Imam al-Hadi and claimed to be his Bab (representative) while also proclaiming al-Hadi's divinity and prophethood, after the death of al-Askari he and his followers would be excommunicated and exiled from the community, formalizing the schism."
 historical_character.me_ishaq_ahmar: "Ishaq al-Ahmar an-Nakha’i is one of the many enemies named by Ibn Nusayr and the founder of a sect identical to [GetRiteByKey('alawite').GetName] known as the Ishaqiyya, which claims Ishaq to be the Bab of the Imams rather than Ibn Nusayr."
 historical_character.me_zakarawayh: "Zakarawayh ibn Mihrawayh was an Ismaili missionary turned Qarmatian leader who led several raids and uprisings against the Abbasids. Though initially loyal to the Ismaili Imam Abdullah al-Mahdi, he began an unauthorized campaign in his name that forced al-Mahdi to flee to North Africa; when the imam refused to return, Zakarawayh adopted Qarmatian doctrines with one of his sons destroying al-Mahdi’s former residence and killing several of his relatives, both of Zakarawayh's sons go on to claim the title of [Glossary( 'Mahdi', 'MAHDI_GLOSS' )] later on."
 historical_character.me_al_jayshani: "Ibn al-Fadl al-Jayshani and Ibn Hawshab were two senior Ismaili missionaries sent by the Imam Abdullah ar-Radi to establish [GetRiteByKey('ismaili').GetName] in Yemen, they would successfully in doing so before the next Imam and first Fatimid caliph declares himself as Mahdi, Ibn al-Fadl would refuse to accept him as such before adopting Qarmatian doctrines and proclaiming himself as Mahdi instead, he would clash with Ibn Hawshab and a few years later they both die and would be succeeded by their sons."
 historical_character.me_baqliyyah: "Abu Hatim az-Zutti was a Qarmatian Jat missionary who appeared in southern Iraq, his followers were forced to comply with dietary restrictions that were found in Dharmic religions such as [GetReligionByKey('jainism_religion').GetName], which forbid the slaughtering of animals and the consumption of leeks, garlic, and turnips."
 historical_character.me_ibn_fadlan: "Ahmad ibn Fadlan was a theologian in the employ of the Abbasids who was sent as an embassy and religious teacher to the recently converted Volga Bulgars, the account of his travels became very famous as it offered a rare glimpse into the lifestyle of the Bulgars, Turkic pagans, and Vikings that lived in the Volga region."
 historical_character.me_abdusamed_babek: "Abd as-Samad Babek, also known as Evdilsemede Babek, was considered to be one of the first who wrote in Kurmaji and the first Kurdish poet to emerge after Islam spread among the Kurds, his poems focused mainly on religion and nature and became very famous among his kinsmen."
 historical_character.al_hariri: "Abu Muhammad al-Qasim al-Hariri al-Basri, also known as al-Hariri of Basra, was an 11th–12th century Arab scholar and writer, best known for his celebrated work 'Maqamat al-Hariri'. This collection of episodic tales, written in rhymed prose, showcases his linguistic mastery, wit, and deep knowledge of Arabic grammar. His work became a cornerstone of classical Arabic literature and a model of eloquence studied for centuries."
 historical_character.ibn_ridwan: "Ali ibn Ridwan was an 11th-century Egyptian physician, astrologer, and commentator on Greek medical texts. Known for his extensive writings on the 2nd century Romano-Greek physician Galen of Pergamon, he also produced influential treatises on epidemiology, including a famous account of a plague in Cairo. His works bridged classical knowledge with Islamic medical practice."
 historical_character.ibn_al_matran: "Muwaffaq ud-Din As'ad 'Ibn al-Matran' was a 12th-century Syrian physician and Christian convert to Islam who served at the court of the Ayyubid ruler Salah ud-Din. Renowned for his medical expertise and translations of Greek texts, he contributed to the transmission and development of medical knowledge in the medieval Islamic world."
 historical_character.ibn_al_tilmidh: "Ibn at-Tilmidh was a 12th-century Nestorian Christian physician, pharmacist, poet, and musician in Baghdad, working as chief physician at the al-Adudi hospital and serving the Abbasid caliph al-Mustadi. He authored numerous medical works including a pharmacopia known as 'al-Aqrabadhin al-Kabir' which became the standard in the hospitals of the Islamic civilization."
 historical_character.al_dakhwar: "Muhadhdhab ud-Din Abd ar-Rahim 'ad-Dakhwar' was a prominent 13th-century Syrian physician and medical educator who served as 'Ra'is ut-Tibb' - Chief of Medicine - for Syria and Egypt under the Ayyubids. He founded ad-Dakhwariyyah in Damascus, one of the oldest and most prominent medical schools in Islamic history, training many notable students such as Ibn Abi Usaibia and Ibn an-Nafis."
 historical_character.ibn_qalaqis: "Ibn Qalaqis was a 12th-century Arab poet from Egypt who spent his years travelling across Egypt, Sicily, and Yemen, and composed poetry for various patrons within these regions while gaining audiences with highly influential figures such as King Willain I of Sicily. The poems and letters he left behind contain much valuable information for historians."
 historical_character.ibn_hanna: "Baha' ud-Din ibn Hanna was a 13th–14th century statesman and administrator who served as last vizier of the Egyptian Ayyubid Sultanate and the first of the Mamluk Sultanate. Rising through the bureaucratic ranks, he held key financial and administrative offices, and was considered the most powerful man of his time and one of the most famous figures of the Mamluk period, many of his descendants would continue to hold high offices during this era."
 historical_character.ibn_nubatah: "Jamal ud-Din Ibn Nubātah al-Masri was an Egyptian Arab poet and writer who was a close confidant of the Mamluk Sultan an-Nasir Hasan, he is recognized as one of the most celebrated Arab poets of the 14th century.\n\nNot to be confused with his ancestor, Abd al-Rahim 'Ibn Nubatah' al-Fariqi, who was a #EMP Khatib#! at the Hamdanid court of Sayf ud-Dawlah."
 historical_character.ibn_al_khatib: "Ibn al-Khatib was a 14th-century Andalusian polymath, historian, physician, and statesman. Serving in the Nasrid court of Granada as vizier, he authored numerous works on history, medicine, and literature, including famous poems such as '#EMP Jadak al-Ghaithu#!' and important observations on disease transmission through contagion during the bubonic plague outbreak, before his political downfall and assassination."
 historical_character.al_battani: "al-Battani, known in Latin as 'Albategnius', was a 9th–10th century Arab astronomer, astrologer, geographer, and mathematician who is considered one of the greatest astronomers of the medieval Islamic world. His work refined measurements of the solar year and planetary motions, and his astronomical tables influenced both Islamic and European astronomy for centuries."
 historical_character.al_quhi: "Abu Sahl Wayjan al-Quhi was a 10th-century Persian mathematician, physicist, and astronomer who is widely considered one of the greatest geometers in history, with many mathematical and astronomical writings ascribed to him. He specialized in solving complex geometric problems involving conic sections and contributed greatly to the development of mathematical methods used in astronomy."
 historical_character.ibn_bajjah: "Ibn Bajjah, known in the Latin as 'Avempace', was a 12th-century Andalusian polymath who's works included philosophy, physics, medicine, astology, botany, poetry, and musician. A key figure in early Islamic philosophy in Spain, he explored the nature of the intellect and the pursuit of truth, influencing later thinkers such as Ibn Tufayl and Ibn Rushd aswell as Western thinkers and astronomers such as Galileo."
 historical_character.ibn_tufayl: "Ibn Tufayl, known in Latin as 'Avetophail', was a 12th-century Andalusian philosopher, physician, and writer who worked as vizier for the ruler of Granada and is best known for his philosophical novel 'Hayy ibn Yaqzan', which is known in Latin as 'Philosophus Autodidactus'. The work explores human understanding and enlightenment through reason and experience, leaving a lasting impact on both Islamic and European thought."
 historical_character.ibn_jubayr: "Ibn Jubayr was a 12th-century Andalusian geographer, traveler, and poet, renowned for his travelogue documenting his journeys across the Mediterranean, the Middle East, and the Islamic world. His detailed observations provide valuable insights into the political, social, and religious life of the medieval period."
 historical_character.al_karaji: "Abu Bakr Muhammad al-Karaji was a 10th–11th-century Persian mathematician and engineer, celebrated for his foundational contributions to algebra. He advanced the use of algebraic methods independent of geometry and is credited with early work on polynomial, arithmetic, and mathematical induction as well as being the first who introduced the theory of algebraic calculus."
 historical_character.ibn_al_shatir: "Ibn ash-Shatir was a 14th-century Syrian astronomer, mathematician, and engineer who worked as the #EMP Muwaqqit#! (timekeeper who regulates prayer times) of the Umayyad Mosque in Damascus. He is renowned for his sophisticated planetary models, which eliminated the need for Ptolemaic epicycles and closely resemble later Copernican formulations. His work represents one of the most advanced achievements of pre-modern astronomy."
 historical_character.ibn_al_quff: "Abu'l Faraj 'Ibn al-Quff' was a 13th-century Melkite Christian Arab physician and surgeon, recognized for his contributions to medical practice and surgical theory. His comprehensive manual "Al-‘Umda fi Sina‘at al-Jiraha" (The Mainstay of the Art of Surgery) systematized surgical knowledge and techniques, making it a key reference in medieval Islamic medicine."
 historical_character.al_rammah: "Hasan 'ar-Rammah' was a 13th-century Syrian military engineer and chemist. He is famed for his treatise on military technology, which describes early uses of gunpowder, rockets, and incendiary devices. His work includes the creation of several new types of gunpowder, a new type of fuse, as well as the first ever prototype of a torpedo."
 historical_character.baha_ud_din_zuhayr: "Baha ud-Din Zuhayr was a 13th-century Arab poet and court official, celebrated for his refined and elegant verse. Serving loyally under Ayyubid Sultan Najm ud-Din Ayyub, his poetry is noted for being elegant yet deceptively simple and he is known for his gentle disposition, skillful mediation, and excellent diplomacy, making him one of the most distinguished literary figures of his time."
 historical_character.ibn_daniyal: "Ibn Daniyal was a 13th-century Egyptian eye physician, poet, and playwright, renowned for his shadow puppet theatre works. His surviving plays, which offer a vivid glimpse into urban life in Mamluk Egypt, depict the lives of craftsmen and laborers while humorously imitating the dialects of various communities living in Egypt at the time."
 historical_character.al_nuwayri: "Shihab ud-Din an-Nuwayri was a 14th-century Egyptian historian and bureaucrat, best known for his encyclopedic work 'Nihayat al-Arab fi Funun al-Adab' (The Ultimate Ambition in the Arts of Erudition), a 9000-page vast compilation which covers history, geography, anatomy, literature, zoology, and more."
 historical_character.ibn_al_haik: "Ibn al-Ha'ik al-Hamdani was a 10th-century Arab historian, geographer, chemist, grammarian, and poet from Yemen, renowned for his detailed works on Arabian history and culture. His writings, particularly "Sifat Jazirat al-Arab," provide invaluable information on the geography, genealogy, and traditions of the Arabian Peninsula."
 historical_character.qutb_ud_din_aibak: "Qutb ud-Din Aibak was a 12th–13th-century Turkic military commander and ruler, known as the founder of the Delhi Sultanate. Originally a #EMP Ghulam#! (slave) of Muhammad of Ghor, he rose through merit to become his trusted general and later established independent rule in northern India after his master’s death. Renowned for his generosity and patronage of architecture, he initiated the construction of the Qutb Minar in Delhi, symbolizing the dawn of Muslim rule in India."
 historical_character.masud_sad_salman: "Mas'ud ibn Sa'd ibn Salman, also known as Mas'ud-i Sa'd-i Salman, was an 11th–12th-century Persian poet who is celebrated for his poignant prison poetry composed during his long years of captivity under the Ghaznavids. His verses vividly express themes of suffering, exile, and resilience, marking him as one of the earliest masters of habsiyat (prison literature) in Persian tradition."
 historical_character.abdul_malik_isami: "Abdul-Malik Isami was a 14th-century Muslim Indian historian and poet, best known for his historical chronicle 'Futuh as-Salatin' (Conquests of Sultans), the work narrates the history of Muslim conquests and rule in India, and despite it's flaws, it is considered a valuble source on the social and political life of 14th century India."
 historical_character.badr_i_chach: "Badr-i Chach was a Central Asian scholar and poet associated with the Persian literary tradition who was in the service of the Sultan of Delhi Muhammad ibn Tughluq. Though relatively obscure, he is remembered for his attempt at finding a geneological link between Muhammad ibn Tughluq and the Sassanids aswell as the valuble historical accounts that his poems provide of medieval Muslim India."
 historical_character.minhaj_i_siraj: "Minhaj-i Siraj Juzjani, also known as Minhaj ud-Din ibn Siraj ud-Din al-Juzani, was a 13th-century Persian historian and scholar, best known for his work 'Tabaqat-i Nasiri', a comprehensive chronicle which documents the history of the Islamic world with particular attention to the Ghurids and early Delhi Sultanate, making it an essential source for medieval Indian and Central Asian history."
 historical_character.me_vanilla: "[Character.Custom('HistoricalCharacterDesc')]"
 
