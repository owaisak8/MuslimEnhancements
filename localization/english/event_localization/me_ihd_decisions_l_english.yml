 me_ihd_events.9002.a.tt:0 "Eid ul-Adha is Starting Soon"
 me_ihd_events.9002.a.tt.adha_starting_soon:0 "[Glossary( 'Eid ul-Adha', 'EID_UL_ADHA_GLOSS' )] will start in #bold 30 days#!, you will have a short window of time to use the #bold $me_choose_udhiyah_amount$#! option in the [GetDecision('ME_observe_islamic_holy_days').GetName] [decision|E]."
 
