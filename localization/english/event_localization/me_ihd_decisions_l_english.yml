 ######################## EVENTS ########################
 
 ### Random Ramadan Events ###
 ME_Ramadan_loc:0 "[Glossary( 'Ramadan', 'RAMADAN_GLOSS' )]"
 ME_Rajab_loc:0 "[Glossary( 'Rajab', 'RAJAB_GLOSS' )]"
 me_broke_fast_modifier:0 "Broken Fast"
 me_broke_fast_modifier_desc:0 "This character broke thir obligatory fast without good reason."
 
 # Divine Smell
 me_ihd_events.0001.t:0 "A Divine Smell"
 me_ihd_events.0001.desc.palace:0 "The palace halls bustle with life as servants hurry to and fro beneath the afternoon sun."
 me_ihd_events.0001.desc.estate:0 "The estate's halls bustle with life as servants hurry to and fro beneath the afternoon sun."
 me_ihd_events.0001.desc.camp:0 "The camp bustles with life as camp members hurry to and fro beneath the afternoon sun."
 me_ihd_events.0001.desc.main:0 " Many of them, like me, are fasting for [ROOT.Char.CustomFixedRandom('ME_GetFastingMonthFaith')|U], yet they continue their duties diligently, truly embodying the temperance required of us during this holy mon— …By [ROOT.Char.GetFaith.HighGodName]… what is that divine smell?!\n\nA rich, warm aroma pulls me toward the kitchens. Perhaps it is the effect of the fast that makes it seem so utterly intoxicating.\n\nSpiced lamb… steaming fresh bread… honey and roasted nut pastries… soups of all types and colors... By [ROOT.Char.GetFaith.HighGodName], this [Glossary( 'iftar', 'IFTAR_GLOSS' )] shall be one fit for a [ROOT.Char.GetTitleAsNameNoTooltip]."
 me_ihd_events.0001.a:0 "But a taste… I need but a taste."
 me_ihd_events.0001.b:0 "The wait shall make this all the more worthwhile."
 
 # Thirsty event
 me_ihd_events.0002.t:0 "A Drink of Water"
 me_ihd_events.0002.desc:0 "The summer sun hangs mercilessly above the land, its heat pressing down like a punishment from above. And here I am, having made the mistake of leaving the shade to go for a stroll.\n\nMy throat is dry as wood and thick with mucus. [Glossary( 'Maghrib', 'MAGHRIB_GLOSS' )] is still hours away, and with every breath I take, it feels as though my throat grows drier still."
 me_ihd_events.0002.a:0 "I need but a sip of water… a mouthful… no more."
 me_ihd_events.0002.b:0 "This is but a simple trial."
 
 # Absentminded Mistakes
 me_ihd_events.0003.t:0 "Absentminded Mistakes"
 me_ihd_events.0003.desc:0 "This day has been long, with many matters within the court demanding my attention. As I take a stroll among the trees, I reach for a fruit from the tree and begin mindlessly chewing, only for the familiar voice of [friendly_courtier.GetFirstName] to call out to me.\n\n“[SCOPE.sC('liege').Custom2('RelationToMeAddress', SCOPE.sC('friendly_courtier'))|U]… were you not fasting today?”\n\nI freeze, realizing too late that I have absentmindedly broken my fast with a piece of fruit.\n\n[friendly_courtier.GetFirstName] laughs at my startled expression. “It seems Allah has fed you, [SCOPE.sC('liege').Custom2('RelationToMeAddress', SCOPE.sC('friendly_courtier'))]! You should continue with your fast, for a simple mistake such as this does not break it.”"
 me_ihd_events.0003.a:0 "I shall, but I will also make up for it by fasting one more day"
 me_ihd_events.0003.b:0 "Mistakes were made…"
 me_ihd_events.0003.c:0 "Ehhh, I already went this far so I might as-well go all the way"
 
 # Frustration in Ramadan
 me_ihd_events.0004.t:0 "Frustration And Fasting"
 me_ihd_events.0004.desc:0 "Frustration grips my chest and I can feel the veins in my temples pulsating. What could have caused this? Is it the fools constantly buzzing in my ears at court from the early hours of [ROOT.Char.CustomFixedRandom('ME_GetFastingMonthFaith')|U]? Or could it be that servant girl who understands simple instructions no better than a mule? Or perhaps it is this fast?\n\nIt would seem this [ROOT.Char.CustomFixedRandom('ME_GetFastingMonthFaith')|U] has sharpened my already irritable nature. Perhaps it would be wise to- No, it must be that damned [target_courtier.GetFirstName]! The way [target_courtier.GetSheHe] talks and walks and… and… AARGH!"
 me_ihd_events.0004.a:0 "Walk properly, you damned buffoon!"
 me_ihd_events.0004.b:0 "I’ll give you a damn good reason not to be able to walk properly!"
 me_ihd_events.0004.c:0 "I need to be patient… Allah is with those who are patient…"
 
 # Vice and Will
 me_ihd_events.0005.t:0 "Vice and Will"
 me_ihd_events.0005.desc:0 "[ROOT.Char.CustomFixedRandom('ME_GetFastingMonthFaith')|U] is meant to be a time of temperance and abstinence, where we have been commanded to abstain from food, drink, and all sexual acts.\n\n"
 me_ihd_events.0005.desc.gluttonous:0 "Despite that, I can’t seem to stop my mouth from watering at the thought of the many dishes I’d usually be indulging in at this hour… juicy spiced meat that falls off the bone… nuts dipped in honey… fruit juices of all kinds both sweet and sour… By [ROOT.Char.GetFaith.HighGodName], will [Glossary( 'Maghrib', 'MAGHRIB_GLOSS' )] never come?!"
 me_ihd_events.0005.desc.drunkard:0 "Despite that, I can’t seem to stop my mind from wandering to the wine hidden in the cellar, it's beautiful balance of sweetness and tartness and its colorful mix of flavors that would soon accompanied by the wave of warm light-headedness.\n\nSoon enough a headache and a wave of nausea begins to build up, a clear symptom of the absence of alcohol in my body."
 me_ihd_events.0005.desc.hashishiyah:0 "Despite that, I can’t seem to stop my mind from wandering to my hashish, this simple shrub whose branches could bring bliss and peace to the mind is unfortunately forbidden to me until [Glossary( 'Maghrib', 'MAGHRIB_GLOSS' )], yet I feel as if I cannot sit still without it!"
 me_ihd_events.0005.desc.lustful_lover:0 "Despite that, I can’t seem to stop my mind from wandering to the most… unsavory of places: the bedroom, with [lover.GetFirstName] laying by my side… by [ROOT.Char.GetFaith.HighGodName], will [Glossary( 'Maghrib', 'MAGHRIB_GLOSS' )] never come?!\n\nI can feel the lust burning inside me like a fire, begging to be released."
 me_ihd_events.0005.desc.lustful_no_lover:0 "Despite that, I can’t seem to stop my mind from wandering to the most… unsavory of places: the brothel, its servants wearing the skimpiest of clothing… by [ROOT.Char.GetFaith.HighGodName], will [Glossary( 'Maghrib', 'MAGHRIB_GLOSS' )] never come?!\n\nI can feel the lust burning inside me like a fire, begging to be released."
 me_ihd_events.0005.a.gluttonous:0 "Maybe a quick run to the kitchen won’t hurt…"
 me_ihd_events.0005.a.drunkard_sin:0 "I’m sinning anyway, what’s the point in waiting?"
 me_ihd_events.0005.a.drunkard_not_sin:0 "I only need one cup to clear my headache at least"
 me_ihd_events.0005.a.hashishiyah:0 "I'll fast another day, for now I need my Hashish"
 me_ihd_events.0005.a.lustful:0 "The brothel can get me what I need"
 me_ihd_events.0005.b:0 "I need [lover.GetFirstName] by my side… NOW"
 me_ihd_events.0005.c:0 "Patience… I only need to wait till sunset"
 me_ihd_events.0005.b.toast.won:0 "You convince [lover.GetFirstName] to break [lover.GetHerHis] fast and lay with you."
 me_ihd_events.0005.b.toast.lost:0 "You fail to convice [lover.GetFirstName]"
 
 # Court food level
 me_ihd_events.0006.t:0 "A [ROOT.Char.GetTitleAsNameNoTooltip]'s Feast"
 me_ihd_events.0006.desc:0 "The time for [Glossary( 'Maghrib', 'MAGHRIB_GLOSS' )] is approaching. The lanterns are lit, and servants stand at the ready while I make my way to the [Glossary( 'iftar', 'IFTAR_GLOSS' )] hall. I take my seat and break my fast with dates and water, as tradition dictates, while the servants begin placing the dishes upon the table.\n\n"
 me_ihd_events.0006.desc.bland_normal:0 "As I take my first bite of the main course, I can’t help but feel… disappointment. It seems even a full day of fasting cannot ease the blandness of the food served at court. Should a [ROOT.Char.GetTitleAsNameNoTooltip] truly allow his court to serve food like this?"
 me_ihd_events.0006.desc.bland_temperate:0 "As I take my first bite of the main course, I can’t help but notice the disappointment written on the faces of the guests and courtiers at the table. It seems the food served at court is far too bland for them. Should a [ROOT.Char.GetTitleAsNameNoTooltip] truly allow his court to serve food like this to his guests?"
 me_ihd_events.0006.desc.modest:0 "[ROOT.Char.CustomFixedRandom('ME_GetFastingMonthFaith')|U] is a time of temperance, and as such the [Glossary( 'iftar', 'IFTAR_GLOSS' )] table is not boisterous; rather, it is characterized by dignity and meticulous organization. The dishes served are modest, yet they ensure that none leave the table disappointed."
 me_ihd_events.0006.desc.lavish_normal:0 "I have been salivating long before I even came close to the dinner hall. The table is lined with plates of juicy meat and steaming rice infused with saffron, hot soups of all kinds, desserts topped with crushed nuts and honey, and all to be washed down with a variety of juices made from fruits and rose petals."
 me_ihd_events.0006.desc.lavish_temperate:0 "My guests have been salivating long before we even came close to the dinner hall. The table is lined with plates of juicy meat and steaming rice infused with saffron, hot soups of all kinds, desserts topped with crushed nuts and honey, and all to be washed down with a variety of juices made from fruits and rose petals. Despite all of this, I’ve chosen to eat more modest meals, better fitting my tastes and the temperance of this holy month."
 me_ihd_events.0006.a:0 "A sultan’s table demands more than this!"
 me_ihd_events.0006.b.bland:0 "Ramadan is a time of temperance, there is nothing wrong with this"
 me_ihd_events.0006.b.cynical:0 "Alhamdulillah, for he is the one who fed us and quenched our thirst."
 me_ihd_events.0006.b.normal:0 "What a filling feast!"

 # Lead the prayer
 me_ihd_events.0007.t:0 "Imam in Prayer"
 me_ihd_events.0007.desc:0 "After everyone in court has had their fill from [Glossary( 'iftar', 'IFTAR_GLOSS' )] and the time for the [Glossary( 'Maghrib', 'MAGHRIB_GLOSS' )] prayer has come, [praying_courtier.GetFirstName] approaches me. “Come, [SCOPE.sC('liege').Custom2('RelationToMeAddress', SCOPE.sC('praying_courtier'))], the [ROOT.Char.Custom('MistressMaster')] of the house must be the one to lead the prayer.”"
 me_ihd_events.0007.a:0 "Rather, the one who has memorized the most Qur’an should lead us."
 me_ihd_events.0007.b:0 "Gladly!"
 me_ihd_events.0007.c:0 "You know… I’m not really a praying man…"
 me_ihd_events.0007.c.every_courtier_and_guest_cynical:0 "Every [courtier|E] and [guest|E] who is not [GetTrait('cynical').GetName( GetNullCharacter )]"
 
 # Solace in Prayer
 me_ihd_events.0008.t:0 "Solace in Prayer"
 me_ihd_events.0008.desc:0 "The quiet of my room settles gently around me as I kneel upon my prayer mat. In the final moments of my [Glossary( 'Asr', 'ASR_GLOSS' )] prayer, I raise my hands with my palms open and facing inward as I begin reciting my supplication.\n\nIn this moment, I do not feel as though I am alone in my room; rather, it is as if I am speaking directly to my Lord. I can feel that this [ROOT.Char.CustomFixedRandom('ME_GetFastingMonthFaith')|U] has brought me closer to [ROOT.Char.GetFaith.HighGodName]. Every day of fasting becomes easier, and every prayer lifts the worries from my shoulders."
 me_ihd_events.0008.a:0 "Allahumma Barik, I am truly blessed."
 
 # Easy Day of Fasting
 me_ihd_events.0009.t:0 "Pleasant Fasting"
 me_ihd_events.0009.desc:0 "Today has been a pleasant day. The weather is mild, the fast has been easy, and I feel particularly energized. But as I look at the people around me, I notice many of them seem drained, as though the throes of [ROOT.Char.CustomFixedRandom('ME_GetFastingMonthFaith')|U] have gotten to them.\n\nYet strangely, I have been on my feet attending to my tasks since the morning, and I do not feel the same way at all."
 me_ihd_events.0009.a:0 "Perhaps fasting comes easier to me than it does to most"
 
 # Last Ten Days of Ramadan
 me_ihd_events.0010.t:0 "Last Days of Ramadan"
 me_ihd_events.0010.desc:0 "We are now in the last ten days of [ROOT.Char.CustomFixedRandom('ME_GetFastingMonthFaith')|U], which are considered the best days of the year for worship. These blessed days include [Glossary( 'Laylat al-Qadr', 'LAYLAT_AL_QADR_GLOSS' )], a night in which worship is better than that of a thousand months. It is recommended to strive in acts of worship during this time to multiply one’s reward in the Hereafter.\n\nAs these sacred nights pass quickly, they serve as a reminder for us to make the most of every moment through prayer, remembrance, and sincere repentance."
 me_ihd_events.0010.a:0 "I will pray and worship as much as possible"
 me_ihd_events.0010.b.23rd:0 "I'll pray well on the 23rd, the night widely believed to be [Glossary( 'Laylat al-Qadr', 'LAYLAT_AL_QADR_GLOSS' )]"
 me_ihd_events.0010.b.27th:0 "I'll pray well on the 27th, the night widely believed to be [Glossary( 'Laylat al-Qadr', 'LAYLAT_AL_QADR_GLOSS' )]"
 me_ihd_events.0010.c:0 "I'll take it easy those last ten days"
 
 # Taraweeh Prayers
 me_ihd_events.0011.t:0 "The Taraweeh"
 me_ihd_events.0011.desc:0 "It is now time for [Glossary( 'Ishaa', 'ISHAA_GLOSS' )], last obligatory prayer of the day. I make my [Glossary( 'Wudhu', 'WUDHU_GLOSS' )] and then make my way to the mosque. This prayer will be followed by the [Glossary( 'Taraweeḥ', 'TARAWEEH_GLOSS' )] prayers, which will take me deeper into the night should I wish to pray the Taraweeh in full."
 me_ihd_events.0011.a:0 "I'll do all 20 [Glossary( 'rakaat', 'RAKAT_GLOSS' )]"
 me_ihd_events.0011.b:0 "I won't see the Taraweeh in full, but I'll do a few [Glossary( 'rakaat', 'RAKAT_GLOSS' )]"
 me_ihd_events.0011.c:0 "I'll only do my obligatory prayers and leave"
 me_nightly_prayers_modifier:0 "Nightly Prayers"
 me_nightly_prayers_modifier_desc:0 "This character spends long hours at night in the mosque to pray."
 
 # Suhur
 me_ihd_events.0012.t:0 "Time For Suhur"
 me_ihd_events.0012.desc.landless:0 "One of the camp members wakes me up, it will soon be time for [Glossary( 'Suhur', 'SUHUR_GLOSS' )], and now in every Muslim district of [capital.GetNameNoTierNoTooltip] there is likely a [Glossary( 'Musaḥḥarati', 'MUSAHHARATI_GLOSS' )] beating his drum to wake the people up so that they may prepare themselves for the day’s fasting.\n\n"
 me_ihd_events.0012.desc.landed:0 "One of my servants wakes me up, it will soon be time for [Glossary( 'Suhur', 'SUHUR_GLOSS' )], and now in every Muslim district of [capital.GetNameNoTierNoTooltip] there is likely a [Glossary( 'Musaḥḥarati', 'MUSAHHARATI_GLOSS' )] beating his drum to wake the people up so that they may prepare themselves for the day’s fasting.\n\n"
 me_ihd_events.0012.desc.gluttonous:0 "Although many prefer a light Suhur, mine is as big and as lavish as it can get, one might think I'm breaking my fast after a long day rather than preparing for it. I scramble to get as much food down my throat as I can, and no sooner that I've swallowed my last bite of food and followed it with water that the call for the [Glossary( 'Fajr', 'FAJR_GLOSS' )] prayer rings out, signaling the start of a new day of fasting."
 me_ihd_events.0012.desc.normal:0 "The meal is light, as it usually is with Suhur, yet it provides a person with enough energy to for the day of fasting. No sooner that I've finished my meal and had my last cup of water that the call for the [Glossary( 'Fajr', 'FAJR_GLOSS' )] prayer rings out, signaling the start of a new day of fasting.
 me_ihd_events.0012.a:0 "Alhamdulillah"
 
 # Irritable Courtier
 me_ihd_events.0013.t:0 "Sharpened Irritability"
 me_ihd_events.0013.desc:0 "[angry_courtier.GetFirstName] has been particularly unpleasant today, getting in everyone’s face and lashing out. It would seem the fasting of [ROOT.Char.CustomFixedRandom('ME_GetFastingMonthFaith')|U] has made [angry_courtier.GetHerHim] pretty irritable, and [angry_courtier.GetHerHis] attitude is becoming a problem for the others.\n\n[target_courtier.GetFirstName], in particular, is quite displeased, and if I don’t do something soon, then a fight may break out."
 me_ihd_events.0013.a:0 "Sit down, you are not the only one fasting!"
 me_ihd_events.0013.b:0 "I’ll take [angry_courtier.GetHerHim] aside and speak to [angry_courtier.GetHerHim] gently"
 me_ihd_events.0013.c:0 "It’s none of my concern"
 me_ihd_events.0013.b.toast.won:0 "You convince [angry_courtier.GetFirstName] to calm down"
 me_ihd_events.0013.b.toast.lost:0 "You fail to convince [angry_courtier.GetFirstName]"
 me_remourseful_opinion:0 "Remourseful"
 
 # Heretical Opinions
 me_ihd_events.0014.t:0 "Loud Ignorance"
 me_ihd_events.0014.desc:0 "[foolish_courtier.GetFirstName] is not fasting today, which isn’t that big of a deal if [foolish_courtier.GetSheHe] wasn’t also claiming that fasting in [ROOT.Char.CustomFixedRandom('ME_GetFastingMonthFaith')|U] is #EMP not#! obligatory, which is a clear and undeniable heresy. Allowing such words to be spoken at my court will reflect badly upon me. I need to do something about [foolish_courtier.GetHerHim] lest he besmirches my name as well as [foolish_courtier.GetHerHis] own."
 me_ihd_events.0014.a:0 "There are grounds for imprisonment here"
 me_ihd_events.0014.b:0 "I’ll take him aside and speak to him"
 me_ihd_events.0014.c:0 "I’ll intimidate him into silence"
 me_ihd_events.0014.d:0 "Just leave him, hopefully he goes quiet on his own"
 me_ihd_events.0014.b.toast.won:0 "You convince [foolish_courtier.GetFirstName]"
 me_ihd_events.0014.b.toast.lost:0 "You fail to convince [foolish_courtier.GetFirstName]"
 me_ihd_events.0014.c.toast.won:0 "You intimidate [foolish_courtier.GetFirstName]"
 me_ihd_events.0014.c.toast.lost:0 "You fail to intimidate [foolish_courtier.GetFirstName]"
 me_heresy_at_court_modifier:0 "Heresy at Court"
 me_heresy_at_court_modifier_desc:0 "This character seems to allow heretical opinions to roam freely at their court"
 
 # Standing on Maghrib
 me_ihd_events.0015.t:0 "Standing On The Sunset"
 me_ihd_events.0015.desc:0 "As I walk through the courtyard, I overhear what seems to be a heated quarrel between two people whom I recognize to be [courtier_1.GetFirstName] and [courtier_2.GetFirstName] as I get closer.\n\n“It is called [Glossary( 'Maghrib', 'MAGHRIB_GLOSS' )] - #EMP the sunset#! - it is obvious that we are meant to break our fast only when the sun fully sets!” exclaims [courtier_1.GetFirstName], whose voice somehow gets louder yet more hoarse by the second.\n\n[courtier_2.GetFirstName] is massaging [courtier_2.GetHerHis] temples, as if nursing a terrible headache. “[Glossary( 'Maghrib', 'MAGHRIB_GLOSS' )] refers to the #EMP prayer of Maghrib#!, not the literal setting of the sun! The fast officially ends once the call to prayer rings out.”"
 me_ihd_events.0015.a:0 "I actually know the scholarly ruling on this"
 me_ihd_events.0015.b:0 "I agree with [courtier_1.GetFirstName], his explanation makes more sense"
 me_ihd_events.0015.c:0 "[courtier_2.GetFirstName] is correct, the call to prayer is what ends the fast"
 me_ihd_events.0015.d:0 "I’ll leave those two alone…"
 
 # Closer to Family
 me_ihd_events.0016.t:0 "Closer Ties"
 me_ihd_events.0016.desc:0 "[ROOT.Char.CustomFixedRandom('ME_GetFastingMonthFaith')|U] truly cannot be the same without my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family_member'))] [family_member.GetFirstName]. Every day at the [Glossary( 'iftar', 'IFTAR_GLOSS' )] table, we exchange stories and engage in long conversations. With every [Glossary( 'suhur', 'SUHUR_GLOSS' )], [family_member.GetSheHe] is there waiting for me, and in every prayer, [family_member.GetSheHe] is there praying at my side.\n\nIt seems [ROOT.Char.CustomFixedRandom('ME_GetFastingMonthFaith')|U] truly does bring family members together, as I feel my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family_member'))] and I have gotten very close this holy month."
 me_ihd_events.0016.a:0 "It is great to have family"
 me_ihd_events.0016.b:0 "Perhaps I should spend my time with someone else…"
 me_spent_ramadan_together:0 "[TARGET_CHARACTER.GetShortUIName] and [CHARACTER.GetShortUIName] got closer over Ramadan."
 me_spent_ramadan_together_corresponding: "$me_spent_ramadan_together$"
 me_spent_rajab_together:0 "[TARGET_CHARACTER.GetShortUIName] and [CHARACTER.GetShortUIName] got closer over Ramadan."
 me_spent_rajab_together_corresponding: "$me_spent_rajab_together$"
 
 
 
 # Dates Merchant
 me_ihd_events.0101.t:0 "Ajwat al-Madina"
 me_ihd_events.0101.desc:0 "A famous merchant visited my court today, bringing many gifts, including a box of expensive yet exceptionally high-quality Ajwah dates. Although this variety of dates is widely grown in North Africa and the Middle East, the merchant claims these particular dates were cultivated on one of the many farms in Medina.\n\nThese dates would make excellent gifts and would be highly coveted, not only for their quality but also for their religious significance, as they are the favored variety of Prophet Muhammad and it is customary to break one’s fast with dates during [ROOT.Char.CustomFixedRandom('ME_GetFastingMonthFaith')|U]."
 me_ihd_events.0101.a:0 "Interesting"
 me_ihd_events.0101.a.tooltip:0 "For as long as you have the [GetModifier('me_dates_merchant_in_town_modifier').GetNameWithTooltip] [character_modifier|E], you will have access to a [character_interaction|E], #V Present Gift of Ajwah Dates#!. The merchant will likely leave in a few weeks, take advantage of his wares while you can."
 me_gifted_ajwah_dates_modifier:0 "Gifted Ajwah Dates"
 me_gifted_ajwah_dates_modifier_desc:0 "This character has been gifted a box of high quality Medina-grown Ajwah dates, a variety favored by Prophet Muhammad."
 me_dates_merchant_in_town_modifier:0 "Ajwah Dates Merchant in Town"
 me_dates_merchant_in_town_modifier_desc:0 "A renowned Ajwah dates merchant is selling his wares not too far from where this character lives.\n\nHas access to an [interaction|E] to #V Present Gift of Ajwah Dates#!"
 me_ihd_events.0102.a.tt:0 "Dates merchant has left"
 ME_gift_ajwah_dates_interaction:0 "Present Gift of Ajwah Dates"
 ME_gift_ajwah_dates_interaction_desc:0 "Purchase a box of high quality Medina-grown Ajwah dates as a gift for [recipient.GetShortUINameNoTooltip]"
 ME_gift_ajwah_dates_effect_muslim_tooltip:0 "[recipient.GetShortUINameNoTooltip] will receive your gift of Ajwah dates, which will give [recipient.GetHerHim] a [character_modifier|E], and since these dates hold some religious significance they will have a higher [opinion|E] of you"
 ME_gift_ajwah_dates_effect_non_muslim_tooltip:0 "[recipient.GetShortUINameNoTooltip] will receive your gift of Ajwah dates, which will give [recipient.GetHerHim] a [character_modifier|E]"
 ME_gifted_dates_muslim_opinion:0 "Gifted Me Ajwah Dates"
 ME_gifted_dates_non_muslim_opinion:0 "Gifted Me High-Quality Dates"
 

 # Ashura
 me_ihd_events.4000.t:0 "Ashura"
 me_ihd_events.4000.desc.other:0 "Today is the tenth of [Glossary( 'Muharram', 'MUHARRAM_GLOSS' )], the day of [Glossary( 'Ashura', 'ASHURA_GLOSS' )]. Prophet Muhammad fasted on this day and encouraged the believers to fast it as well, along with either a day before it or a day after it, as it is on this day that Allah saved Prophet Musa and his people by allowing him to part the Red Sea.\n\nFasting on this day is not an obligation, but merely voluntary. A believer may choose to fast [Glossary( 'Ashura', 'ASHURA_GLOSS' )] alone or fast all three days to gain more rewards in the Hereafter."
 me_ihd_events.4000.desc.shia:0 "Today is the tenth of [Glossary( 'Muharram', 'MUHARRAM_GLOSS' )], the day of [Glossary( 'Ashura', 'ASHURA_GLOSS' )]. It is the day on which Imam al-Husayn, the grandson of the Prophet, was tragically martyred at the Battle of Karbala. Shops close, with many of the faithful marching onto the streets and performing various acts of public lamentation as a form of mourning for Imam al-Husayn’s death.\n\nAlthough observing [Glossary( 'Ashura', 'ASHURA_GLOSS' )] is not obligatory, it is a highly significant event that grants the believer many rewards in the hereafter."
 me_ihd_events.4000.a:0 "I shall follow the Sunnah and fast all three days!"
 me_ihd_events.4000.b:0 "Fasting Ashura alone is enough for me"
 me_ihd_events.4000.c:0 "I shall mourn Imam al-Husayn in public!"
 me_ihd_events.4000.d:0 "Bring me my whip, I shall mourn in the best way I can"
 me_ihd_events.4000.e.other:0 "I do not think I have the will to fast…"
 me_ihd_events.4000.e.shia:0 "I do not think I have the will to observe this day..."


