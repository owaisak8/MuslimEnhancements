l_english:


 ### Gloss ###
 RAMADAN_GLOSS: "The month of #bold Ramadan#! is the ninth month of the [Glossary( 'Hijri', 'HIJRI_GLOSS' )] calendar and is the month in which the Qur'an was revealed to the Islamic Prophet Muhammad, it is observed by Muslims as a month of fasting, prayer, and reflection. Ramadan ends with the celebration known as [Glossary( 'Eid ul-Fitr', 'EID_UL_FITR_GLOSS' )]."
 RAJAB_GLOSS: "The month of #bold Rajab#! is the seventh month of the [Glossary( 'Hijri', 'HIJRI_GLOSS' )] calendar and is one of four sacred months in Islam in which battles are prohibited.\n\nHistorically, certain Berberist sects have used this month as a replacement for [Glossary( 'Ramadan', 'RAMADAN_GLOSS' )]."
 EID_UL_FITR_GLOSS: "#bold Eid ul-Fitr#! - 'The Celebration of Breaking the Fast' - is one of two main Islamic celebrations that comes after [Glossary( 'Ramadan', 'RAMADAN_GLOSS' )] and is marked with gift-giving, social gatherings, and an obligatory form of charity known as 'Zakat al-Fitr', who's main purpose is to help the poor so that they can celebrate the festival alongside the rest of the Muslims."
 EID_UL_ADHA_GLOSS: "#bold Eid ul-Adha#! - 'The Celebration of the Sacrifice' - is one of two main Islamic celebrations that is marked with ritual animal sacrifice, gift-giving, social gatherings, and immense charity. The meat from the sacrifices is divided with a third given to the sacrificer, a third to his family, and a third to the poor.\n\nIt is a commemoration of Ibrahim's willingness to sacrifice his son in obedience to God, as Islamic tradition goes, God would send a trial upon Ibrahim by sending him a revelation to sacrifice his son, for which the son would express his willingness to die for God. Acknowledging their obediance, Allah would send down a sheep to be sacrifice in the son's stead."
 HIJRI_GLOSS: "The #bold Hijri#! calendar is an Islamic lunar calendar who's epoch is the Hijra - The Migration - an event in which Prophet Muhammad and his followers would travel from Mecca to Medina.\n\nCertain Shi'ite sects recognize the month of Rabi' al-Awwal as the first month rather than Muharram, which can cause a one-year discrepancy between dates."
 IFTAR_GLOSS: "#bold Iftar#! is the Arabic word for 'breaking the fast' and is most commonly associated with [Glossary( 'Ramadan', 'RAMADAN_GLOSS' )], where Muslims fast from the beginning of the day till [Glossary( 'Maghrib', 'MAGHRIB_GLOSS' )]."
 MUHARRAM_GLOSS: "The month of #bold Muharram#! is the first month of the [Glossary( 'Hijri', 'HIJRI_GLOSS' )] calendar and is one of four sacred months in Islam in which battles are prohibited.\n\nIt is the month in which [Glossary( 'Ashura', 'ASHURA_GLOSS' )] takes place, and for that the first ten days are used as days of mourning for certain Shi'ite sects."
 ASHURA_GLOSS: "#bold Ashura'#! is the tenth day of [Glossary( 'Muharram', 'MUHARRAM_GLOSS' )] within the [Glossary( 'Hijri', 'HIJRI_GLOSS' )] calendar and is the day in which Husayn ibn Ali, the grandson of Prophet Muhammad, was martyred in the battle of Karbala and as such this day is used as a day of public mourning and rememberance within the Shi'ite traditions.\n\nIn the Sunni tradition, it marks the parting of the Red Sea by Prophet Musa, and it is customary to voluntarily fast on this day, along with either the day before or the day after, as encouraged by Prophet Muhammad."
 FAJR_GLOSS: "The #bold Fajr#! prayer is the first of five daily prayers in traditional Islam and begins between the break of dawn and sunrise.\n\nFajr's call for prayer marks to begining of fasting in and outside of [Glossary( 'Ramadan', 'RAMADAN_GLOSS' )]."
 ASR_GLOSS: "The #bold Asr#! prayer is the third of five daily prayers in traditional Islam and begins approximately when the sun is halfway down from noon to sunset."
 MAGHRIB_GLOSS: "The #bold Maghrib#! - 'Sunset' - prayer is the fourth of five daily prayers in traditional Islam, it's call to prayer is what marks the end of one's fast for that day.\n\nSome sects adhere to the idea that it is not the call to prayer that ends the fast but rather the full setting of the sun."
 ISHAA_GLOSS: "The #bold Ishaa'# prayer is the last of five daily prayers in traditional Islam and begins at night, though the exact specifications differ between sects and schools of law.\n\nIn [Glossary( 'Ramadan', 'RAMADAN_GLOSS' )], Ishaa is followed by the [Glossary( 'Taraweeḥ', 'TARAWEEH_GLOSS' )] prayers."
 RAKAT_GLOSS: "A #bold Rak'ah#! - #EMP plural 'Rak'at'#! - is a single iteration of prescribed movements and supplications performed by Muslims as part of the prescribed obligatory prayer. Each of the five daily prayers observed by Muslims consists of a number of rak'at."
 LAYLAT_AL_QADR_GLOSS: "#bold Laylat al-Qadr#! - meaning the 'Night of Decree' or the 'Night of Destiny' - is a night that comes during the last 10 days of [Glossary( 'Ramadan', 'RAMADAN_GLOSS' )] and is mentioned in the Qur'an, blessings through acts of worship and charity are multiplied to the point of where it is better than a thousand months.\n\nAlthough the specific date of Laylat al-Qadr is not mentioned in the Qur'an, there is a widely held but contested belief among Sunni Muslims that it falls on the 27th, while Shi'ites have generally concluded that it falls on the 23rd."
 TARAWEEH_GLOSS: "The #bold Taraweeḥ#! are special prayers performed after [Glossary( 'Ishaa', 'ISHAA_GLOSS' )] and exclusively during the Islamic month of [Glossary( 'Ramadan', 'RAMADAN_GLOSS' )], usually consisting of 20 [Glossary( 'rakaat', 'RAKAT_GLOSS' )]."
 WUDHU_GLOSS: "The #bold Wudhu#! is a form of Islamic ritual purification by ablution that is done before prayer."
 SUHUR_GLOSS: "#bold Suhur#! is a meal consumed early in the morning before fasting, before dawn during or outside the month of [Glossary( 'Ramadan', 'RAMADAN_GLOSS' )]. This meal helps provide energy for the day of fasting and is often eaten shortly before [Glossary( 'Fajr', 'FAJR_GLOSS' )]."
 MUSAHHARATI_GLOSS: "The #bold Musaḥḥarati#! is a public waker for [Glossary( 'suhur', 'SUHUR_GLOSS' )] and [Glossary( 'Fajr', 'FAJR_GLOSS' )] during [Glossary( 'Ramadan', 'RAMADAN_GLOSS' )], historically it is said that the first musaḥḥarati was Bilal ibn Rabaḥ, a companion of Prophet Muhammad."

