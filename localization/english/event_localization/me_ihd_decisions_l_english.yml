 me_muharram_tatbir_option:0 "Practice Tatbir"
 me_muharram_skip_option:0 "Forgo Mourning"
 me_muharram_deep_option_desc:0 "Wear black, eschew music and celebration, and attend nightly majalis where the maqtal of Imam Husayn is recited in full. Receive scholars and sayyids at your court, weep openly for the House of the Prophet, and let no cheerful voice be heard in your hall until [Glossary( 'Ashura', 'ASHURA_GLOSS' )] has passed.\n\n#T Effects (activate each year for the first 12 days of Muharram):#!\n[GetModifier('me_muharram_deep_mourning_modifier').GetNameWithTooltip]\n#N Stress gain#! for #high [GetTrait('impatient').GetName( GetNullCharacter )]#!, #high [GetTrait('cynical').GetName( GetNullCharacter )]#!, #high [GetTrait('callous').GetName( GetNullCharacter )]#!\n#P Stress loss#! for #high [GetTrait(zealous).GetName( GetNullCharacter )]#!, #high [GetTrait(compassionate).GetName( GetNullCharacter )]#!"
 me_muharram_moderate_option_desc:0 "Acknowledge the mourning as is proper, attend a majlis, host a scholar, wear sober colors on [Glossary( 'Ashura', 'ASHURA_GLOSS' )], while keeping the affairs of your realm in order. The path of most Shia rulers throughout history.\n\n#T Effects (activate each year for the first 12 days of Muharram):#!\n[GetModifier('me_muharram_moderate_mourning_modifier').GetNameWithTooltip]\n#N Stress gain#! for #high [GetTrait(zealous).GetName( GetNullCharacter )]#!"
 me_muharram_tatbir_option_desc:0 "Join the processions of #high Tatbir#!, striking your own head or back with blade or chain until blood flows, that you might share, however faintly, in the agonies of Karbala. Controversial even among Shia scholars, but for the flagellant soul, a cleansing fire.\n\n#italic Requires the Flagellant trait.#!\n\n#T Effects (activate each year for the 10 days leading up to [Glossary( 'Ashura', 'ASHURA_GLOSS' )]):#!\n[GetModifier('me_muharram_tatbir_modifier').GetNameWithTooltip]\n#P -25%#! Stress Gain\n#P Immediate (on declaration):#! #high medium stress loss#!\n#N Stress gain#! for #high [GetTrait('cynical').GetName( GetNullCharacter )]#!, #high [GetTrait('craven').GetName( GetNullCharacter )]#!\n#P Stress loss#! for #high [GetTrait('flagellant').GetName( GetNullCharacter )]#!, #high [GetTrait('brave').GetName( GetNullCharacter )]#!"
 me_muharram_skip_option_desc:0 "Hold court, hunt, feast, and attend to politics as in any other month. The sayyids will not forget. The common Shia will not forget. Karbala is not a wound one may politely ignore.\n\n#T Effects (activate each year for the first 12 days of Muharram):#!\n[GetModifier('me_muharram_skipped_modifier').GetNameWithTooltip]\n#N Stress gain#! for #high [GetTrait(zealous).GetName( GetNullCharacter )]#!, #high [GetTrait('compassionate').GetName( GetNullCharacter )]#!\n#P Stress loss#! for #high [GetTrait('cynical').GetName( GetNullCharacter )]#!"
 me_muharram_deep_option_tooltip:0 "Standing decree: [GetModifier('me_muharram_deep_mourning_modifier').GetNameWithTooltip]\nActive for the first 12 days of Muharram each year."
 me_muharram_moderate_option_tooltip:0 "Standing decree: [GetModifier('me_muharram_moderate_mourning_modifier').GetNameWithTooltip]\nActive for the first 12 days of Muharram each year."
 me_muharram_tatbir_option_tooltip:0 "Standing decree: [GetModifier('me_muharram_tatbir_modifier').GetNameWithTooltip]\nActive for the 10 days leading up to [Glossary( 'Ashura', 'ASHURA_GLOSS' )] each year."
 me_muharram_skip_option_tooltip:0 "Standing decree: [GetModifier('me_muharram_skipped_modifier').GetNameWithTooltip]\nActive for the first 12 days of Muharram each year."

 me_muharram_deep_mourning_modifier:0 "Deep Mourning for Husayn"
 me_muharram_deep_mourning_modifier_desc:0 "In deep mourning for the martyrdom of Imam Husayn at Karbala."
 me_muharram_moderate_mourning_modifier:0 "Mourning for Husayn"
 me_muharram_moderate_mourning_modifier_desc:0 "Observing the mourning of [Glossary( 'Muharram', 'MUHARRAM_GLOSS' )] in the customary manner."
 me_muharram_tatbir_modifier:0 "Practicing Tatbir"
 me_muharram_tatbir_modifier_desc:0 "Sharing in the suffering of Husayn through ritual flagellation. Body wounded, grief cathartically released."
 me_muharram_skipped_modifier:0 "Forgoing Muharram"
 me_muharram_skipped_modifier_desc:0 "Has shown no regard for the mourning of Imam Husayn, offending the Shia faithful."

 ## Muharram Patronage Event (Second Window)
 me_ihd_events.5010.t:0 "State Patronage of Muharram"
 me_ihd_events.5010.desc:0 "Your viziers and the sayyids of your court await your word on the scale of state patronage for [Glossary( 'Muharram', 'MUHARRAM_GLOSS' )]. The sponsorship of majalis by an independent Shia ruler is no small matter: it binds the faithful to your house, and quickens the bonds of faith in the counties you rule.\n\nYour choice is a #high standing decree#!: it will take effect each year when Muharram arrives and persist until you revise it. The chosen tier will draw a #high percentage of your monthly income#! for the first 12 days of Muharram, and bestow county modifiers across your realm for that same period."
 me_ihd_events.5010.none:0 "No state patronage."
 me_ihd_events.5010.modest:0 "Fund modest majalis across the realm."
 me_ihd_events.5010.grand:0 "Fund grand majalis across the realm."
 me_ihd_events.5010.lavish:0 "Spare no expense; fund lavish majalis everywhere."
 me_muharram_patronage_none_tt:0 "#N No state patronage.#! The mourning remains private; no majlis is held on the treasury's account."
 me_muharram_patronage_modest_tt:0 "#high Modest patronage:#! each [Glossary( 'Muharram', 'MUHARRAM_GLOSS' )], every sub-realm county of your faith gains the [GetModifier('me_muharram_patronage_modest_modifier').GetNameWithTooltip] [modifier|E] for 12 days."
 me_muharram_patronage_grand_tt:0 "#high Grand patronage:#! each [Glossary( 'Muharram', 'MUHARRAM_GLOSS' )], every sub-realm county of your faith gains the [GetModifier('me_muharram_patronage_grand_modifier').GetNameWithTooltip] [modifier|E] for 12 days."
 me_muharram_patronage_lavish_tt:0 "#high Lavish patronage:#! each [Glossary( 'Muharram', 'MUHARRAM_GLOSS' )], every sub-realm county of your faith gains the [GetModifier('me_muharram_patronage_lavish_modifier').GetNameWithTooltip] [modifier|E] for 12 days."

 me_muharram_patronage_modest_modifier:0 "Modest Muharram Patronage"
 me_muharram_patronage_modest_modifier_desc:0 "Sponsoring simple mourning assemblies across the realm. Treasury drawn upon at a #high 5% monthly income#! reduction for the first 12 days of [Glossary( 'Muharram', 'MUHARRAM_GLOSS' )]."
 me_muharram_patronage_grand_modifier:0 "Grand Muharram Patronage"
 me_muharram_patronage_grand_modifier_desc:0 "Sponsoring substantial mourning assemblies with renowned reciters. Treasury drawn upon at a #high 15% monthly income#! reduction for the first 12 days of [Glossary( 'Muharram', 'MUHARRAM_GLOSS' )]."
 me_muharram_patronage_lavish_modifier:0 "Lavish Muharram Patronage"
 me_muharram_patronage_lavish_modifier_desc:0 "A grand public mourning, with processions, husayniyyas, and the greatest reciters of the age. Treasury drawn upon at a #high 35% monthly income#! reduction for the first 12 days of [Glossary( 'Muharram', 'MUHARRAM_GLOSS' )]."
 me_muharram_majalis_modest_county_modifier:0 "Modest Muharram Majalis"
 me_muharram_majalis_modest_county_modifier_desc:0 "The ruler has funded simple mourning assemblies here. The bonds of faith quicken, easing the path of conversion."
 me_muharram_majalis_grand_county_modifier:0 "Grand Muharram Majalis"
 me_muharram_majalis_grand_county_modifier_desc:0 "The ruler has sponsored substantial mourning assemblies here, drawing renowned reciters. Faith spreads more readily."
 me_muharram_majalis_lavish_county_modifier:0 "Lavish Muharram Majalis"
 me_muharram_majalis_lavish_county_modifier_desc:0 "The ruler has sponsored a grand public mourning here. Faith spreads swiftly; the bonds of community are at their strongest."

