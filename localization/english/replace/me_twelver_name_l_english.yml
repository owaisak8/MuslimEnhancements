 # ME: the Twelver faith (key: ithna_ashari) and its Rite (key: imami) share one name.
 # These MUST be plain text: the game shows a faith's name exactly as written and does not evaluate [ ] inside it
 # (tested 2026-10-04: a rule-driven name showed as raw bracket text in-game, and an earlier variant crashed at launch).
 # To use another name (Ja'farism, Twelver Shi'ism, Imamism), change the eight lines below.
 ithna_ashari:0 "Ithna 'Asharism"
 ithna_ashari_adj:0 "Ithna 'Ashari"
 ithna_ashari_adherent:0 "Ithna 'Ashari"
 ithna_ashari_adherent_plural:0 "Ithna 'Asharis"
 imami:0 "Ithna 'Asharism"
 imami_adj:0 "Ithna 'Ashari"
 imami_adherent:0 "Ithna 'Ashari"
 imami_adherent_plural:0 "Ithna 'Asharis"
