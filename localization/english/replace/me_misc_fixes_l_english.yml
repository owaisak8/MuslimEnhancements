l_english:

 #Buildings
 building_type_the_friday_mosque_01:0 "Jameh Mosque of Isfahan"
 building_type_the_friday_mosque_01_desc:0 "#F The Jameh Mosque of Isfahan, otherwise known as the Friday Mosque, was built during the rule of the Umayyad dynasty. It is said that the Caliph personally made one of the pillars in the mosque. Before becoming a mosque, it is said that it used to be a house of worship for Zoroastrians.#!"

 # Shrine and holy mosque descriptions (vanilla keys, rewritten)
 building_type_holy_site_imam_ali_mosque_01_desc:0 "#F On the high ground of Najaf, beyond the walls of Kufa, rests Ali ibn Abi Talib, cousin and son-in-law of the Prophet, struck down at prayer in the month of Ramadan. For generations his family kept the grave hidden for fear of his enemies; now that it is known, pilgrims cross the desert to stand beneath its dome, and the faithful ask to be buried in the valley beside him."
 building_type_imam_reza_shrine_01_desc:0 "#F In a garden outside Tus rests Ali ar-Ridha, the eighth Imam, summoned east to be named heir to the Caliph and dead, many say by poison, before he could return home. He lies far from the graves of his forefathers, and so is called the Imam of the Stranger; those who make the long road to him trust that he will answer for them in turn. Around the tomb a sanctuary grows with every caravan: prayer halls, a library, a bazaar."
 building_type_holy_site_great_mosque_of_mecca_01_desc:0 "#F At the heart of Mecca stands the Kaaba, the House raised by Ibrahim and his son Ismail for the worship of the one God, and around it the mosque toward which every Muslim turns in prayer. Ruler after ruler has widened its courts and colonnades to hold the multitudes of the Hajj, who come from every land to circle the House as the Prophet did."
 building_type_holy_site_prophetic_mosque_01_desc:0 "#F When the Prophet came to Medina he let his camel choose the ground, and there, with his own hands, he helped raise a mosque of palm trunks and mud brick beside his home. In that home he was laid to rest, and the mosque has since grown to enclose the chamber. It is said that the ground between his grave and his pulpit is a garden from the gardens of Paradise."

