 #Events
 head_of_faith.0021.desc:0 "Rejecting the tawdry politics of the Sunnis and Shi'ites has left [ROOT.Char.GetFaith.GetName] an adherent to the Muhakkima strand of Islam. However, the followers of our movement are confused on where we stand on the Muhakkima spectrum, do we consider ourselves Ibadis or are we our own people? and if so, who's leaders do we follow?"
 head_of_faith.0021.ME.a:0 "We are Ibadis, but our leaders are our own."

