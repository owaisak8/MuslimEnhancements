 ## Hostility Doctrines ## 
 #Ibadism/Wahbism Hostility
 special_doctrine_is_ibadi_faith_name:0 "Ahl al-Istiqama"
 is_ibadi_faith_name:0 "$special_doctrine_is_ibadi_faith_name$"
 special_doctrine_is_ibadi_faith_desc:0 "The distance between our communities may have forced us to adopt different leaders but our core teachings and identity remain the same, it does not matter where we are and who we follow, for in the end we are all Ahl al-Istiqama!"
 doctrine_parameter_hostility_override_special_doctrine_is_ibadi_faith:0 "Considers and is considered by [faiths|E] with the [GetDoctrineType('special_doctrine_is_ibadi_faith').GetBaseName] [doctrine|E], to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."

 ## Isma'ili Doctrines ##
 #Ubaydi Trait Acceptance
 special_doctrine_ubaydi_trait_acceptance_name:0 "The Fatimid Lineage"
 ubaydi_trait_acceptance_name:0 "$special_doctrine_ubaydi_trait_acceptance_name$"
 special_doctrine_ubaydi_trait_acceptance_desc:0 "While some may refuse to acknowledge the Fatimids as legitamate members of Ahl al-Bayt, claiming that their geneology was falsified, we accept their claims of lineage as the direct descendants of the Prophet."
 doctrine_parameter_ubaydi_trait_effects_active:0 "Characters with the [GetTrait('ubaydi').GetName( GetNullCharacter )] [trait|E] receive bonuses."

 #Musta'li Schism - Main
 special_doctrine_mustali_main_name:0 "Schismed Isma'ilism"
 mustali_main_name:0 "$special_doctrine_mustali_main_name$"
 special_doctrine_mustali_main_desc:0 "The succession of the Caliphate became muddy with the death of al-Amir and disappearance of his son, now the Musta'li Isma'ilis have become divided on who our leaders and guiders should be."
 doctrine_parameter_mustali_main_effects_active:0 "[faiths|E] with [GetDoctrineType('special_doctrine_mustali_schismed_sect').GetBaseName] [doctrine|E] gain [EmptyScope.ScriptValue('mustali_schismed_sect_conversion_bonus_root_value')|=-%0] conversion speed against this [faith|E]"
 doctrine_parameter_hostility_override_special_doctrine_mustali_schismed_sect:0 "Considers [faiths|E] with [GetDoctrineType('special_doctrine_mustali_schismed_sect').GetBaseName] [doctrine|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."

