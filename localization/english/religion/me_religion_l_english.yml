 special_doctrine_mustali_schismed_sect_desc:0 "The succession of the Caliphate became muddy with the death of al-Amir and disappearance of his son, now the Musta'li Isma'ilis have become divided on who our leaders and guiders should be."
 doctrine_parameter_mustali_schismed_sect_effects_active:0 "[EmptyScope.ScriptValue('mustali_schismed_sect_conversion_bonus_root_value')|=+%0] conversion speed against the [GetRiteByKey('ismaili').GetAdjective] [faith|E]"
