 doctrine_me_affinality_polygamy_name:0 "Affinal Polygamy"
 doctrine_me_affinality_polygamy_dynastic_name: "Lineal Prohibition"
 doctrine_me_affinality_polygamy_dynastic_desc: "It is strictly forbidden to marry another with whom your spouse shares a surname and common ancestry, no matter how distantly related, nor is it acceptable to marry those of other surnames proximate through blood."
