 ## Islamic Faiths ## 
 #Wahbiya - North African Ibadi Islam
 wahbiya:0 "Wahbism"
 wahbiya_adj:0 "Wahbi"
 wahbiya_adherent:0 "Wahbi"
 wahbiya_adherent_plural:0 "Wahbis"
 wahbiya_desc:0 "The Wahbiyya are the followers of the North African branch of Ibadi Islam, they have their own leaders seperate from the distant imams in Oman, and eventually it's followers started to develop their own seperate teachings, taking the name 'al-Wahbiyya' from the Imam Abd al-Wahhāb Rustamid in Tahret."
 d_wahbiya:0 "Wahbi Imamate"
 d_wahbiya_article:0 "the "
 d_wahbiya_adj:0 "Wahbi"

 #Nukkari
 nukkari:0 "Nukkarism" #al-Nukkār
 nukkari_adj:0 "Nukkari"
 nukkari_adherent:0 "Nukkari"
 nukkari_adherent_plural:0 "Nukkaris"
 nukkari_desc:0 "al-Nukkār — the Deniers — were a group of North African Ibadis who refused to recognise the authority of the Imam Abd al-Wahhāb Rustamid, they argued that the passing of the Imamate dynastically from Abd al-Rahman to Abd al-Wahhāb was contrary to Ibadi teachings, and instead appointed Abu Qudama al-Ifrani as their Imam."
 d_nukkari:0 "Nukkari Imamate"
 d_nukkari_article:0 "the "
 d_nukkari_adj:0 "Nukkari"
 
 #Tayyibism
 tayyibi:0 "Tayyibism"
 tayyibi_adj:0 "Tayyibi"
 tayyibi_adherent:0 "Tayyibi"
 tayyibi_adherent_plural:0 "Tayyibis"
 tayyibi_desc:0 "Tayyibism asserts that the true line of succession to the Caliphate is through al-Amir's son, at-Tayyib, who is believed to have been sent into seclusion and that a line of Imams continues through him in hiding, in their absence the Tayyibis are led by the Unrestricted Missionary (ad-Da'i al-Mutlaq) who holds the highest spiritual office."
 d_tayyibi:0 "The Tayyibi Mission"
 d_tayyibi_adj:0 "Tayyibi"
 tayyibi_religious_head_title:0 "Da'i al-Mutlaq"
 tayyibi_religious_head_title_name:0 "The Tayyibi Mission"
 me_dai_al_mutlaq_male:0 "Da'i al-Mutlaq"
 me_dai_al_mutlaq_female:0 "Da'iah al-Mutlaqah"
 
 #Ishaqiya
 ishaqiya:0 "Ishaqism"
 ishaqiya_adj:0 "Ishaqi"
 ishaqiya_adherent:0 "Ishaqite"
 ishaqiya_adherent_plural:0 "Ishaqi"
 
 #Salihiyya (Tabiriyya/Batriyya)
 salihi:0 "Salihism"
 salihi_adj:0 "Salihi"
 salihi_adherent:0 "Salihi"
 salihi_adherent_plural:0 "Salihis"
 salihi_desc:0 "Also known as the Tabiriyya, the Salihiyya are a sub-sect of Zaydism who follow the teachings of Hasan ibn Salih, they believe that Abu Bakr, Umar, Uthman, and Aisha had been in error in failing to follow Imam Ali but it did not render them as disbelievers. In matters of jurisprudence, they share much in common with Sunni practice while maintaining their distinct Shi’a identity."

 #Karramiyya
 karrami:0 "Karramism"
 karrami_adj:0 "Karrami"
 karrami_adherent:0 "Karrami"
 karrami_adherent_plural:0 "Karramis"
 karrami_desc:0 "Founded by Muhammad ibn Karram in the 9th century, Karramism is a Sunni movement that was considered heretical by non-Karrami Sunnis for it's supposed anthropomorphisation of God. It was characterised by self-mortification, renunciation, and voluntary poverty that it's followers used order to get closer to Allah."

 #Baqliyyah/Buraniyyah
 baqli:0 "Baqlism"
 baqli_adj:0 "Baqli"
 baqli_adherent:0 "Baqli"
 baqli_adherent_plural:0 "Baqlis"
 baqli_desc:0 "The Baqliyyah - a term that translates to legume-eaters - are the followers of the Qarmatian sect of Abu Hatim az-Zatti, who abolished Islamic religious observances and introduced Dharmic practices such as forbidding the slaughtering of animals and the prohibition of consuming garlic, leeks, and turnips"

 ## Non-Islamic Faiths ##
 #Trika Shaivism (Kashmiri Shaivism)
 trika_shaivism:0 "Trika Shaivism"
 trika_shaivism_adj:0 "Trika"
 trika_shaivism_adherent:0 "Trika"
 trika_shaivism_adherent_plural:0 "Trikas"
 trika_shaivism_desc:0 "Trika Shaivism, otherwise known simply as Kashmiri Shaivism, is a sect of Hinduism that originated in the Kashmir region and places special emphasis on non-dualism. Trika Shaivists follow the Mālinīvijayottara Tantra, considering it to be one of their most important theological manuscripts."
 
