 ## Ablution Doctrines ##
 doctrine_me_ablution_name:0 "Ablution Ritual"
 
 #No Ablution
 doctrine_me_ablution_none_name:0 "No Ablution Ritual"
 doctrine_me_ablution_none_desc:0 "We have no need to purify ourselves daily, doing so would be a waste of precious water."
 doctrine_parameter_me_ablution_none:0 "[characters|E] of this [faith|E] receive no bonuses"
 
 #Daily Handwashing
 doctrine_me_ablution_handwashing_name:0 "Daily Handwashing"
 doctrine_me_ablution_handwashing_desc:0 "We must cleanse our hands before every meal and every prayer, [ROOT.Faith.HighGodName] would not accept anything less."
 doctrine_parameter_me_ablution_handwashing:0 "Non-[GetTrait('cynical').GetName( GetNullCharacter )] [characters|E] of this [faith|E] are less likely to get infected by [epidemics|E]"
 
 #Partial Body Ablution/Wudhu/Rishama
 doctrine_me_ablution_full_name:0 "Partial Body Ablution"
 doctrine_me_ablution_full_desc:0 "This world is full of things that would leave a man tainted and filthy, it would be unbefitting of us to face [ROOT.Faith.HighGodName] in prayer with such filth on our bodies."
 doctrine_parameter_me_ablution_full:0 "Non-[GetTrait('cynical').GetName( GetNullCharacter )] [characters|E] of this [faith|E] are significantly less likely to get infected by [epidemics|E]"
 doctrine_me_ablution_wudhu_name:0 "Wudhu"
 doctrine_me_ablution_wudhu_desc:0 "Following the commandments of [ROOT.Faith.HighGodName], we must cleanse ourselves multiple times a day, meticulously cleaning our hands, face, arms, and feet as we must be pure when we offer ourselves to him in prayer."
 doctrine_me_ablution_rishama_name:0 "Rishama"
 
 ## Fasting Month Doctrines ##
 doctrine_me_fasting_month_name:0 "Fasting Month"
 doctrine_parameter_ihd_decision_active:0 "The [decision|E] to [GetDecisionWithKey('ME_observe_islamic_holy_days').GetName] becomes active."

 #Fasting in Ramadan
 doctrine_me_fasting_month_ramadan_name:0 "Ramadan"
 doctrine_me_fasting_month_ramadan_desc:0 "'#EMP Oh you who believe! Fasting is prescribed for you as it was for those before you, that you may become mindful of Allah.#!'"
 doctrine_parameter_fasting_month_ramadan:0 "Adherents fast during [Glossary( 'Ramadan', 'RAMADAN_GLOSS' )]."
 
 #Fasting in Rajab
 doctrine_me_fasting_month_rajab_name:0 "Rajab"
 doctrine_me_fasting_month_rajab_desc:0 "Those before us may have been ordered to fast in Ramadan, but we have been ordered to fast in Rajab."
 doctrine_parameter_fasting_month_rajab:0 "Adherents fast during [Glossary( 'Rajab', 'RAJAB_GLOSS' )]."
 
 #No Monthly Fasting
 doctrine_me_fasting_month_none_name:0 "None"
 doctrine_me_fasting_month_none_desc:0 "We are not tied by any obligation to observe a month of fasting."
 doctrine_parameter_fasting_month_none:0 "Will not recieve any [decisions|E] or events related to monthly fasting."
 
 ## Affinal Doctrines ##
 AFFINAL_CONSANGUINITY_INCOMPATIABLE:0 "Incompatible with the chosen $doctrine_consanguinity_name$ [doctrine|E]"
 AFFINAL_FIXED_POLYGAMY_INCOMPATIABLE:0 "Incompatible with the chosen $doctrine_me_affinality_fixed_name$ [doctrine|E]"

 doctrine_me_affinality_fixed_name:0 "Affinal Restrictions"
 doctrine_me_affinality_fixed_dynastic_name: "Lineal Prohibition"
 doctrine_me_affinality_fixed_dynastic_desc: "It is strictly forbidden to marry another with whom your spouse shares a surname and common ancestry, no matter how distantly related, nor is it acceptable to marry those of other surnames proximate through blood."
 doctrine_parameter_affinal_restricted_dynastic_marriage_fixed: "Marriage with a member of a a current or former [spouse|E]'s [dynasty|E] is forbidden"
 doctrine_me_affinality_fixed_extended_family_name:0 "Extended-kin Prohibition"
 doctrine_me_affinality_fixed_extended_family_desc:0 "Marriage renders the family of one's spouse to be their own, and so it is a sin against [ROOT.Faith.HighGodName] to permit two relatives to marry each other or engage in sexual relationships."
 doctrine_parameter_affinal_restricted_extended_kin_marriage_fixed:0 "Marriage with a current or former [spouse|E]'s [extended_family_members|E] and/or [close_family_members|E] is forbidden"
 doctrine_parameter_affinal_restricted_extended_kin_incest_fixed:0 "Sexual relations a current or former [spouse|E]'s [extended_family_members|E] and/or [close_family_members|E] will give the incest [secret|E]"
 doctrine_me_affinality_fixed_cousins_name:0 "Cousin Prohibition"
 doctrine_me_affinality_fixed_cousins_desc:0 "$doctrine_me_affinality_fixed_extended_family_desc$"
 doctrine_parameter_affinal_restricted_close_kin_marriage_fixed:0 "Marriage with a current or former [spouse|E]'s cousins is forbidden"
 doctrine_parameter_affinal_restricted_close_kin_incest_fixed:0 "Sexual relations with a a current or former [spouse|E]'s cousins will give the incest [secret|E]"
 doctrine_me_affinality_fixed_close_kin_name:0 "Close-kin Prohibition"
 doctrine_me_affinality_fixed_close_kin_desc:0 "Your spouse's brothers and sisters are your own, and for two siblings to couple is an abhorant thing."
 doctrine_parameter_affinal_restricted_cousin_marriage_fixed:0 "Marriage with a current or former [spouse|E]'s [close_family_members|E] is forbidden"
 doctrine_parameter_affinal_restricted_cousin_incest_fixed:0 "Sexual relations a current or former [spouse|E]'s [close_family_members|E] will give the incest [secret|E]"
 doctrine_me_affinality_fixed_parental_name:0 "Parent-Child Prohibition"
 doctrine_me_affinality_fixed_parental_desc:0 "The parents and children of ones spouse must be treated as their own, and a union between a parent and a child is an abhorant thing."
 doctrine_parameter_affinal_restricted_parental_marriage_fixed:0 "Marriage with a current or former [spouse|E]'s parent or child is forbidden"
 doctrine_parameter_affinal_restricted_parental_incest_fixed:0 "Sexual relations a current or former [spouse|E]'s parent or child will give the incest [secret|E]"
 doctrine_me_affinality_fixed_unrestricted_name:0 "Unrestricted Marriage"
 doctrine_me_affinality_fixed_unrestricted_desc:0 "There is no blood relation between a person and their affinal family, as such their would be no reason to restrict their marriage."
 doctrine_parameter_affinal_unrestricted_marriage_fixed:0 "Marriage with a current or former [spouse|E]'s family members is allowed"
