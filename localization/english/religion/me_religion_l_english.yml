 doctrine_me_affinality_polygamy_extended_family_name:0 "Extended-kin Prohibition"
 doctrine_me_affinality_polygamy_extended_family_desc:0 "Marriage renders the family of one's spouse to be their own, and so it is a sin against [ROOT.Faith.HighGodName] to permit two relatives to marry each other or engage in sexual relationships."
