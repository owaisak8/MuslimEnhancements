 ## Islamic Secondary Sect Doctrines ##
 doctrine_islam_secondary_group_name:0 "Theological Affiliation" 
 REQUIRES_SUNNI:0 "Requires the [GetDoctrineType('muhammad_succession_sunni_doctrine').GetBaseName] [doctrine|E]"
 REQUIRES_SHIA:0 "Requires the [GetDoctrineType('muhammad_succession_shia_doctrine').GetBaseName] [doctrine|E]"
 REQUIRES_MUHAKKIMA:0 "Requires the [GetDoctrineType('muhammad_succession_muhakkima_doctrine').GetBaseName] [doctrine|E]"
 REQUIRES_ZANDAQA:0 "Requires the [GetDoctrineType('muhammad_succession_zandaqa_doctrine').GetBaseName] [doctrine|E]"
 REQUIRES_BERBERIST:0 "Requires the [GetDoctrineType('muhammad_succession_berberist_doctrine').GetBaseName] [doctrine|E]"
 
 #Sunni Orthodoxy
 islam_secondary_group_sunni_orthodox_doctrine_name:0 "Sunni Orthodoxy"
 islam_secondary_group_sunni_orthodox_doctrine_desc:0 "Our schools of thought have developed closely alongside one another, and the differences of theology are far too minor to consider ourselves separate groups."
 doctrine_parameter_hostility_override_islam_secondary_group_sunni_orthodox_doctrine:0 "Considers [GetDoctrineType('islam_secondary_group_sunni_orthodox_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 
 #Unorthodox Sunnism
 islam_secondary_group_sunni_heresy_doctrine_name:0 "Unorthodox Sunni"
 islam_secondary_group_sunni_heresy_doctrine_desc:0 "Although we are Sunni by definition, our beliefs differ too much from those of the orthodoxy in order for us to consider ourselves as part of the same group, our relations still remain amicable, however."
 doctrine_parameter_hostility_override_islam_secondary_group_sunni_heresy_doctrine:0 "Considers [GetDoctrineType('islam_secondary_group_sunni_heresy_doctrine').GetBaseName] [faiths|E] with the to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 
 #Puritanical Sunnism
 islam_secondary_group_sunni_puritanical_doctrine_name:0 "Puritanical Sunni"
 islam_secondary_group_sunni_puritanical_doctrine_desc:0 "There is only one true path that Allah will accept, and there will be no compromise for the sake of the deviants."
 doctrine_parameter_hostility_override_islam_secondary_group_sunni_puritanical_doctrine:0 "Considers [GetDoctrineType('islam_secondary_group_sunni_puritanical_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 doctrine_parameter_me_puritanical_conversion_bonus_sunni:0 "[EmptyScope.ScriptValue('puritanical_islam_conversion_bonus_root_value')|=+%0] conversion speed against other [GetDoctrineType('muhammad_succession_sunni_doctrine').GetBaseName] [faiths|E]"
 doctrine_parameter_me_puritanical_conversion_bonus_other_sunni:0 "[EmptyScope.ScriptValue('puritanical_islam_conversion_bonus_root_value')|=+%0] conversion speed against [GetDoctrineType('islam_secondary_group_sunni_puritanical_doctrine').GetBaseName] [faiths|E]"
 puritanical_islam_sunni_conversion_task_desc:0 "Puritanical Sunni converting or being converted by other Sunnis"
 
 #Shi'ite Affiliations
 islam_secondary_group_shia_orthodox_doctrine_name:0 "Shi'ite Affiliated"
 islam_secondary_group_shia_orthodox_doctrine_desc:0 "We acknowledge the rights of the Ahl al-Bayt and condemn their enemies, those who are akin to us may not always be perfect but they are better than most."
 doctrine_parameter_hostility_override_islam_secondary_group_shia_orthodox_doctrine:0 "Considers [GetDoctrineType('islam_secondary_group_shia_orthodox_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 
 #Batri Affiliations
 islam_secondary_group_shia_batriya_doctrine_name:0 "Batri Affiliated"
 islam_secondary_group_shia_batriya_doctrine_desc:0 "Although we hold that the only true successor to the Prophet is the Imam Ali, we do not view the Sunni Caliphs to be disbelievers, as they were virtuous and just rulers who played a crucial role in spreading Islam."
 doctrine_parameter_hostility_override_islam_secondary_group_shia_batriya_doctrine:0 "Considers [GetDoctrineType('islam_secondary_group_shia_batriya_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 
 #Puritanical Shi'ism
 islam_secondary_group_shia_puritanical_doctrine_name:0 "Puritanical Shi'ite"
 islam_secondary_group_shia_puritanical_doctrine_desc:0 "There is only one true path that Allah will accept, and there will be no compromise for the sake of the deviants."
 doctrine_parameter_hostility_override_islam_secondary_group_shia_puritanical_doctrine:0 "Considers [GetDoctrineType('islam_secondary_group_shia_puritanical_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 doctrine_parameter_me_puritanical_conversion_bonus_shia:0 "[EmptyScope.ScriptValue('puritanical_islam_conversion_bonus_root_value')|=+%0] conversion speed against other [GetDoctrineType('muhammad_succession_shia_doctrine').GetBaseName] [faiths|E]"
 doctrine_parameter_me_puritanical_conversion_bonus_other_shia:0 "[EmptyScope.ScriptValue('puritanical_islam_conversion_bonus_root_value')|=+%0] conversion speed against [GetDoctrineType('islam_secondary_group_shia_puritanical_doctrine').GetBaseName] [faiths|E]"
 puritanical_islam_shia_conversion_task_desc:0 "Puritanical Shi'ite converting or being converted by other Shi'ites"
 
 #Moderate Muhakkima
 islam_secondary_group_muhakkima_moderate_doctrine_name:0 "Moderate Muhakkima"
 islam_secondary_group_muhakkima_moderate_doctrine_desc:0 "Although we share a common origin point, we do not agree with the other extremist Muhakkima who condemn the other sects to death for their act of disbelief."
 doctrine_parameter_hostility_override_islam_secondary_group_muhakkima_moderate_doctrine:0 "Considers [GetDoctrineType('islam_secondary_group_muhakkima_moderate_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 
 #Puritanical Muhakkima
 islam_secondary_group_muhakkima_puritanical_doctrine_name:0 "Puritanical Muhakkima"
 islam_secondary_group_muhakkima_puritanical_doctrine_desc:0 "There is only one true path that Allah will accept, and there will be no compromise for the sake of the deviants."
 doctrine_parameter_hostility_override_islam_secondary_group_muhakkima_puritanical_doctrine:0 "Considers [GetDoctrineType('islam_secondary_group_muhakkima_puritanical_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 doctrine_parameter_me_puritanical_conversion_bonus_muhakkima:0 "[EmptyScope.ScriptValue('puritanical_islam_conversion_bonus_root_value')|=+%0] conversion speed against other [GetDoctrineType('muhammad_succession_muhakkima_doctrine').GetBaseName] [faiths|E]"
 doctrine_parameter_me_puritanical_conversion_bonus_other_muhakkima:0 "[EmptyScope.ScriptValue('puritanical_islam_conversion_bonus_root_value')|=+%0] conversion speed against [GetDoctrineType('islam_secondary_group_muhakkima_puritanical_doctrine').GetBaseName] [faiths|E]"
 puritanical_islam_muhakkima_conversion_task_desc:0 "Puritanical Muhakkima converting or being converted by other Muhakkimas"
 
 #Unaffiliated Zandaqa
 islam_secondary_group_zandaqa_unaffiliated_doctrine_name:0 "Unaffiliated"
 islam_secondary_group_zandaqa_unaffiliated_doctrine_desc:0 "Our theology and beliefs are far too disconnected from the other sects for us to be considered part of any of their groups."
 doctrine_parameter_hostility_override_islam_secondary_group_zandaqa_unaffiliated_doctrine:0 "Considers [GetDoctrineType('islam_secondary_group_zandaqa_unaffiliated_doctrine').GetBaseName] [faiths|E] [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 
 #Ghulat
 islam_secondary_group_zandaqa_ghulat_doctrine_name:0 "Ghulat"
 islam_secondary_group_zandaqa_ghulat_doctrine_desc:0 "Our belief in the divine nature of the Imams mark us as outcasts even among the Shi'ites. Let the other so-called 'believers' call us Ghulāt (Exaggerators), we merely afford the bloodline of the Prophet the full respect it is due!"
 doctrine_parameter_hostility_override_islam_secondary_group_zandaqa_ghulat_doctrine:0 "Considers [GetDoctrineType('islam_secondary_group_zandaqa_ghulat_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 
 #Qarmatian
 islam_secondary_group_zandaqa_qarmatian_doctrine_name:0 "Qarmatian"
 islam_secondary_group_zandaqa_qarmatian_doctrine_desc:0 "A splinter group of the original Isma’ili Shi’ites, The Qarmatians have been known to attack the holy cities of Islam which has made them reviled by the all the Muslim sects."
 doctrine_parameter_hostility_override_islam_secondary_group_zandaqa_qarmatian_doctrine:0 "Considers [GetDoctrineType('islam_secondary_group_zandaqa_qarmatian_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 
 #Unaffiliated Berberist
 islam_secondary_group_berberist_doctrine_name:0 "Unaffiliated"
 islam_secondary_group_berberist_doctrine_desc:0 "Our theology and beliefs are far too disconnected from the other sects for us to be considered part of any of their groups."
 doctrine_parameter_hostility_override_islam_secondary_group_berberist_doctrine:0 "Considers [GetDoctrineType('islam_secondary_group_berberist_unaffiliated_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 

