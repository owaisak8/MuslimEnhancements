 hinglaj_mata_01:0 "Hinglaj Mata"
 hinglaj_mata_01_desc:0 "#F In a cave above the Hingol river, deep in the barren hills of Makran, a shapeless stone smeared with vermilion is worshipped as Hinglaj, the Mother. Here, it is told, the crown of Sati's head fell to earth when the discus of Vishnu parted her body, making this the first among the seats of the Goddess. Pilgrims cross the desert for many days to reach her, and the tribes of the country, whatever their faith, hold the place in reverence, calling her Nani, the Grandmother.#!"
 building_hinglaj_mata_01:0 "$hinglaj_mata_01$"
 building_hinglaj_mata_01_desc:0 "$hinglaj_mata_01_desc$"
 building_type_hinglaj_mata_01:0 "$hinglaj_mata_01$"
 building_type_hinglaj_mata_01_desc:0 "$hinglaj_mata_01_desc$"
 sijilmasa_market_01:0 "Gold Market of Sijilmasa"
 sijilmasa_market_01_desc:0 "#F At the edge of the great desert, where the Ziz loses itself among the palms of Tafilalt, stands the city from which the caravans set out for the land of gold. Salt goes south on ten thousand camels and returns as dust and ingots, and in the market of Sijilmasa it is weighed out by merchants come from Kairouan, Basra, and Córdoba.#!"
 building_sijilmasa_market_01:0 "$sijilmasa_market_01$"
 building_sijilmasa_market_01_desc:0 "$sijilmasa_market_01_desc$"
 building_type_sijilmasa_market_01:0 "Gold Market of Sijilmasa"
 building_type_sijilmasa_market_01_desc:0 "$sijilmasa_market_01_desc$"
 sijilmasa_market_02:0 "Mint of Sijilmasa"
 sijilmasa_market_02_desc:0 "#F Gold that came north as dust now leaves Sijilmasa as coin. The dinars struck here in the name of its master are so pure and of so true a weight that they pass without question from the Atlantic to the Nile, and carry his name wherever they go.#!"
 building_sijilmasa_market_02:0 "$sijilmasa_market_02$"
 building_sijilmasa_market_02_desc:0 "$sijilmasa_market_02_desc$"
 building_type_sijilmasa_market_02:0 "$sijilmasa_market_02$"
 building_type_sijilmasa_market_02_desc:0 "$sijilmasa_market_02_desc$"
 aden_port_01:0 "Port of Aden"
 aden_port_01_desc:0 "#F Aden lies in the crater of a dead volcano, walled by black rock on every side but the sea, with no water but what its ancient cisterns catch from the rare rains. Yet every ship between Egypt and al-Hind must call here, and the tithe taken on pepper, cloth, and aloes has made the masters of this barren rock richer than the kings of green countries.#!"
 building_aden_port_01:0 "$aden_port_01$"
 building_aden_port_01_desc:0 "$aden_port_01_desc$"
 building_type_aden_port_01:0 "Port of Aden"
 building_type_aden_port_01_desc:0 "$aden_port_01_desc$"
 aden_port_02:0 "Customs House of Aden"
 aden_port_02_desc:0 "#F A customs house now stands at the water gate of Aden, where every bale and jar is opened, counted, and taxed before it may enter the city, and galleys patrol the straits against the pirates who prey upon the India fleets. Nothing passes between the two seas without paying its due here.#!"
 building_aden_port_02:0 "$aden_port_02$"
 building_aden_port_02_desc:0 "$aden_port_02_desc$"
 building_type_aden_port_02:0 "$aden_port_02$"
 building_type_aden_port_02_desc:0 "$aden_port_02_desc$"
 bahla_fort_01:0 "Fortress of Bahla"
 bahla_fort_01_desc:0 "#F Rising on its rock above the palm groves of Bahla, this fortress of mud brick upon stone footings is counted the oldest in Oman, and a wall many miles in length encloses the whole oasis, its fields and water channels together with its houses. From such a seat the lords of the interior may defy Imam and coastal sultan alike.#!"
 building_bahla_fort_01:0 "$bahla_fort_01$"
 building_bahla_fort_01_desc:0 "$bahla_fort_01_desc$"
 building_type_bahla_fort_01:0 "Fortress of Bahla"
 building_type_bahla_fort_01_desc:0 "$bahla_fort_01_desc$"
 darb_zubayda_01:0 "Ruined Stations of the Darb Zubayda"
 darb_zubayda_01_desc:0 "#F The road of Zubayda has fallen on hard days. Raiders have burned its hostels, sand has filled its cisterns, and the pilgrims who still dare the crossing travel armed and thirsty. Yet the wells are sound beneath the rubble, and a ruler with the means could restore this great work of charity.#!"
 building_darb_zubayda_01:0 "$darb_zubayda_01$"
 building_darb_zubayda_01_desc:0 "$darb_zubayda_01_desc$"
 building_type_darb_zubayda_01:0 "Darb Zubayda"
 building_type_darb_zubayda_01_desc:0 "$darb_zubayda_01_desc$"
 darb_zubayda_02:0 "Cisterns of the Darb Zubayda"
 darb_zubayda_02_desc:0 "#F From Kufa to Mecca, across nine hundred miles of stone and sand, runs the road that the lady Zubayda, wife of Harun al-Rashid, furnished from her own purse: wells cut through rock, cisterns the size of lakes, hostels, and fire-beacons a day's march apart. At al-Rabadha, where the Companion Abu Dharr lies buried, the pilgrims find one of the greatest of its reservoirs, and they bless her name as they drink.#!"
 building_darb_zubayda_02:0 "$darb_zubayda_02$"
 building_darb_zubayda_02_desc:0 "$darb_zubayda_02_desc$"
 building_type_darb_zubayda_02:0 "$darb_zubayda_02$"
 building_type_darb_zubayda_02_desc:0 "$darb_zubayda_02_desc$"
 nizwa_imamate_01:0 "Seat of the Imamate"
 nizwa_imamate_01_desc:0 "#F Among the date gardens beneath the Green Mountain lies Nizwa, which the people of Oman call the Egg of Islam. Here the scholars gather to choose the most worthy among them as Imam, and to depose him if he strays, and from here he rules without crown or guard, as the first believers were ruled. When no Imam sits in Nizwa its mosque is a mosque like any other, and the scholars wait.#!"
 building_nizwa_imamate_01:0 "$nizwa_imamate_01$"
 building_nizwa_imamate_01_desc:0 "$nizwa_imamate_01_desc$"
 building_type_nizwa_imamate_01:0 "$nizwa_imamate_01$"
 building_type_nizwa_imamate_01_desc:0 "$nizwa_imamate_01_desc$"
