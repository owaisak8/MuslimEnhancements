l_english:

 ## Building Requirements ##
 NOT_muslim_me_building_trigger:0 "The holder must be a Muslim."
 NOT_shia_and_others_me_building_trigger:0 "The holder must follow an [GetReligionByKey('islam_religion').GetAdjective] [faith|E] with either the [GetDoctrineType('muhammad_succession_shia_doctrine').GetBaseName], [GetDoctrineType('islam_secondary_group_zandaqa_ghulat_doctrine').GetBaseName], or [GetDoctrineType('islam_secondary_group_zandaqa_qarmatian_doctrine').GetBaseName] succession [doctrines|E]."
 NOT_christian_me_building_trigger:0 "The holder must be Christian"
 NOT_imami_me_building_trigger:0 "The holder must follow an [GetReligionByKey('islam_religion').GetAdjective] [faith|E] that has the [GetTitleByKey('d_imami').GetNameNoTier] as its [head_of_faith|E]."
 NOT_ismaili_me_building_trigger:0 "The holder must have the [GetDoctrineType('special_doctrine_ubaydi_trait_acceptance').GetBaseName] [doctrine|E]."
 NOT_zoroastrian_me_building_trigger:0 "The holder must be a Zoroastrian"
 NOT_yazidi_me_building_trigger:0 "The holder must be a Yazidi"
 NOT_eastern_me_building_trigger:0 "The holder must be Hindu, Buddhist, or Jain"
 eastern_me_building_trigger:0 "The holder is Hindu, Buddhist, or Jain"

 ## Common Buildings ##
 building_madrasa_01:0 "Madrasa"
 building_type_madrasa_01:0 "Madrasa"
 building_type_madrasa_01_desc:0 "$building_madrasa_01_desc$"
 building_madrasa_01_desc:0 "#F A Madrasa is a place of Islamic scholarly learning, debate, and ideological exchange. Attendants of the Madrasa are instructed in Islamic law, Quranic studies, and are given a basis upon which to conduct themselves as curious, inquiring Muslims.#!"
 building_madrasa_desc:0 "$building_madrasa_01_desc$"

 ## Unique Buildings ##
 holy_site_lalish_shrine_01:0 "Yazidi Shrine of Lalish"
 building_type_holy_site_lalish_shrine_01:0 "Yazidi Shrine of Lalish"
 building_type_holy_site_lalish_shrine_01_desc:0 "$building_holy_site_lalish_shrine_01_desc$"
 building_holy_site_lalish_shrine_01_desc:0 "#F In a wooded valley north of Mosul, beneath spires fluted like the rays of the sun, lies the tomb of Sheikh Adi ibn Musafir. The faithful enter barefoot, stepping over the threshold without touching it, to visit the lamps that are lit each evening with olive oil and the sacred springs in whose waters every child of the community is baptized. Each autumn they gather here for the Feast of the Assembly.#!"
 building_holy_site_lalish_shrine_01:0 "$building_type_holy_site_lalish_shrine_01$"
 building_holy_site_lalish_shrine_desc:0 "$building_holy_site_lalish_shrine_01_desc$"

 al_ukhaidir_fortress_01:0 "Fortress of al-Ukhaydir"
 building_type_al_ukhaidir_fortress_01:0 "Fortress of al-Ukhaidir"
 building_type_al_ukhaidir_fortress_01_desc:0 "$al_ukhaidir_fortress_01_desc$"
 al_ukhaidir_fortress_01_desc:0 "#F Alone in the desert west of Kufa stands a palace within a fortress, raised, it is said, by Isa ibn Musa, the Abbasid prince who was made to renounce his claim to the Caliphate and withdrew from court. Behind towered walls pierced with arrow-slits lie vaulted halls, courts, baths, and a mosque: everything a prince might need to live in splendor far from the eyes of Baghdad.#!"
 building_al_ukhaidir_fortress_01:0 "$al_ukhaidir_fortress_01$"
 building_al_ukhaidir_fortress_01_desc:0 "$al_ukhaidir_fortress_01_desc$"
 
 alcazar_seville_01:0 "Alcázar of Seville"
 building_type_alcazar_seville_01:0 "Alcázar of Seville"
 building_type_alcazar_seville_01_desc:0 "$alcazar_seville_01_desc$"
 alcazar_seville_01_desc:0 "#F Raised by Abd al-Rahman III as a fortified seat for his governors after Seville's rebellion against Córdoba, the Alcázar was made a place of delight by the Abbadid kings, above all the poet-king al-Mu'tamid, who praised his palace al-Mubarak, the Blessed, in verse. Behind its walls lie courts of carved stucco and glazed tile, sunken gardens, and channels of running water.#!"
 building_alcazar_seville_01:0 "$alcazar_seville_01$"
 building_alcazar_seville_01_desc:0 "$alcazar_seville_01_desc$"

 alcazaba_almeria_01:0 "Alcázaba of Almería"
 building_type_alcazaba_almeria_01:0 "Alcázaba of Almería"
 building_type_alcazaba_almeria_01_desc:0 "$alcazaba_almeria_01_desc$"
 alcazaba_almeria_01_desc:0 "#F Abd al-Rahman III raised this citadel when he made Almería the arsenal and chief harbor of his fleet. From its ridge the walls command the bay and the city below, whose thousands of looms weave the silks and brocades that are carried to every shore of the Mediterranean.#!"
 building_alcazaba_almeria_01:0 "$alcazaba_almeria_01$"
 building_alcazaba_almeria_01_desc:0 "$alcazaba_almeria_01_desc$"

 alcazaba_badajoz_01:0 "Alcázaba of Badajoz"
 building_type_alcazaba_badajoz_01:0 "Alcázaba of Badajoz"
 building_type_alcazaba_badajoz_01_desc:0 "$alcazaba_badajoz_01_desc$"
 alcazaba_badajoz_01_desc:0 "#F When the rebel Ibn Marwan al-Jilliqi made his peace with the emir of Córdoba, he was allowed to found a city of his own on the hill above the Guadiana, and this citadel was its first stone. Under the Aftasid kings it became the seat of a court renowned for its learning, guarding the western march of al-Andalus against the Christians of the north.#!"
 building_alcazaba_badajoz_01:0 "$alcazaba_badajoz_01$"
 building_alcazaba_badajoz_01_desc:0 "$alcazaba_badajoz_01_desc$"

 toledo_walls_01:0 "Walls of Toledo"
 building_type_toledo_walls_01:0 "Walls of Toledo"
 building_type_toledo_walls_01_desc:0 "$toledo_walls_01_desc$"
 toledo_walls_01_desc:0 "#F The City walls of Toledo were first erected under Roman rule. Having been passed back and forth between the conquerors of Iberia, Toledo's walls have been added on over centuries to create a truly formidable defense for the ancient city.#!"
 building_toledo_walls_01:0 "$toledo_walls_01$"
 building_toledo_walls_01_desc:0 "$toledo_walls_01_desc$"

 faro_walls_01:0 "Muralha de Faro"
 building_type_faro_walls_01:0 "Muralha de Faro"
 building_type_faro_walls_01_desc:0 "$faro_walls_01_desc$"
 faro_walls_01_desc:0 "#F The walls of Santa Maria of the West, which the Romans knew as Ossonoba, rise from the edge of a lagoon sheltered from the ocean by a chain of sandy islands. Roman foundations carry Byzantine towers, and upon these the lords of the Gharb have built anew, piercing the circuit with a gate beneath a horseshoe arch through which the fishermen and salt-traders pass.#!"
 building_faro_walls_01:0 "$faro_walls_01$"
 building_faro_walls_01_desc:0 "$faro_walls_01_desc$"

 fort_algeciras_01:0 "Fort of Jabal al-Fatḥ"
 building_type_fort_algeciras_01:0 "Fort of Jabal al-Fatḥ"
 building_type_fort_algeciras_01_desc:0 "$fort_algeciras_01_desc$"
 fort_algeciras_01_desc:0 "#F The fort of Jabal al-Fatḥ was built early on in the Arab invasion of Iberia, on the Mountain of Jabal al-Fatḥ, and overlooks the mediterranean. The fort is named for the Rock of Gibraltar, which the Arabs call Jabal al-Fatḥ, translating to the Mountain of the Conquest.#!"
 building_fort_algeciras_01:0 "$fort_algeciras_01$"
 building_fort_algeciras_01_desc:0 "$fort_algeciras_01_desc$"

 fort_alicante_01:0 "Fort of Banu Qatil"
 building_type_fort_alicante_01:0 "Fort of Banu Qatil"
 building_type_fort_alicante_01_desc:0 "$fort_alicante_01_desc$"
 fort_alicante_01_desc:0 "#F Crowning the bare rock of Banu Qatil high above the harbor of Laqant, this castle sees every sail on the approach to the coast and every rider on the road from Murcia. No engine can be brought against it and no ladder can reach it; those who hold it need fear only hunger and treachery.#!"
 building_fort_alicante_01:0 "$fort_alicante_01$"
 building_fort_alicante_01_desc:0 "$fort_alicante_01_desc$"

 qusayr_amra_01:0 "Qusayr Amra"
 building_type_qusayr_amra_01:0 "Qusayr Amra"
 building_type_qusayr_amra_01_desc:0 "$qusayr_amra_01_desc$"
 qusayr_amra_01_desc:0 "#F In the steppe east of Amman the Umayyad prince al-Walid ibn Yazid built a small lodge with a bath, where he might hunt, drink, and listen to singers far from the censure of Damascus. Its walls and vaults are painted from floor to ceiling: hunters and bathers, musicians and dancers, the stars of heaven turning in the dome, and the kings of the earth, Caesar, Khosrow, the Negus, and Roderic of the Goths, arrayed in homage.#!"
 building_qusayr_amra_01:0 "$qusayr_amra_01$"
 building_qusayr_amra_01_desc:0 "$qusayr_amra_01_desc$"

 fortress_amida_01:0 "Fortress of Amida"
 building_type_fortress_amida_01:0 "Fortress of Amida"
 building_type_fortress_amida_01_desc:0 "$fortress_amida_01_desc$"
 fortress_amida_01_desc:0 "#F The walls of Amida, built of black basalt by the Emperor Constantius and strengthened by every master since, run for a league along the bluff above the Tigris. Their towers and iron gates are carved with the inscriptions of emperors, caliphs, and emirs, each proclaiming his own repairs, and the people call their city Amid the Black.#!"
 building_fortress_amida_01:0 "$fortress_amida_01$"
 building_fortress_amida_01_desc:0 "$fortress_amida_01_desc$"

 uqba_mosque_01:0 "Great Mosque of Kairouan"
 building_type_uqba_mosque_01:0 "Great Mosque of Kairouan"
 building_type_uqba_mosque_01_desc:0 "$uqba_mosque_01_desc$"
 uqba_mosque_01_desc:0 "#F Founded by Uqba ibn Nafi when he marked out Kairouan as the camp of the conquest, and rebuilt in its present majesty by the Aghlabid emirs, this is the mother of all the mosques of the Maghreb. Its massive three-tiered minaret watches over a hall of marble and porphyry columns gathered from the ruins of Roman Africa, and beneath them the school of Imam Malik is taught by the heirs of Sahnun.#!"
 building_uqba_mosque_01:0 "$uqba_mosque_01$"
 building_uqba_mosque_01_desc:0 "$uqba_mosque_01_desc$"
 building_type_uqba_mosque_01_duchy:0 "$uqba_mosque_01$"
 building_type_uqba_mosque_01_duchy_desc:0 "$uqba_mosque_01_desc$"
 building_uqba_mosque_01_duchy:0 "$uqba_mosque_01$"
 building_uqba_mosque_01_duchy_desc:0 "$uqba_mosque_01_desc$"

 hejra_01:0 "al-Hijr"
 building_type_hejra_01:0 "al-Hijr"
 building_type_hejra_01_desc:0 "$hejra_01_desc$"
 hejra_01_desc:0 "#F Cut into the sandstone cliffs of the Wadi al-Qura are the silent facades of al-Hijr, which the Nabataeans left behind and which the Quran names as the dwellings of Thamud, the people of Salih, destroyed for hamstringing the she-camel sent to them as a sign. When the Prophet passed this way on the march to Tabuk he forbade his men to drink from its wells or to enter save in tears, and the pilgrim caravans from Syria still hurry past without making camp.#!"
 building_hejra_01:0 "$hejra_01$"
 building_hejra_01_desc:0 "$hejra_01_desc$"

 citadel_antioch_01:0 "Citadel of Antioch"
 building_type_citadel_antioch_01:0 "Citadel of Antioch"
 building_type_citadel_antioch_01_desc:0 "$citadel_antioch_01_desc$"
 citadel_antioch_01_desc:0 "#F High on Mount Silpius, where the walls of Antioch climb from the Orontes to the crest, stands the citadel that guards the city Seleucus founded. Justinian rebuilt the circuit after the Persians sacked it, with towers beyond counting, and it is so vast that no army can invest it entirely. Antioch has more often fallen to treachery than to assault.#!"
 building_citadel_antioch_01:0 "$citadel_antioch_01$"
 building_citadel_antioch_01_desc:0 "$citadel_antioch_01_desc$"

 citadel_antioch_02:0 "Citadel of Antioch"
 building_type_citadel_antioch_02:0 "Citadel of Antioch"
 building_type_citadel_antioch_02_desc:0 "$citadel_antioch_01_desc$"
 citadel_antioch_02_desc:0 "#F High on Mount Silpius, where the walls of Antioch climb from the Orontes to the crest, stands the citadel that guards the city Seleucus founded. Justinian rebuilt the circuit after the Persians sacked it, with towers beyond counting, and it is so vast that no army can invest it entirely. Antioch has more often fallen to treachery than to assault.#!"
 building_citadel_antioch_02:0 "$citadel_antioch_01$"
 building_citadel_antioch_02_desc:0 "$citadel_antioch_01_desc$"

 citadel_alexander_01:0 "Citadel of Alexander"
 building_type_citadel_alexander_01:0 "Citadel of Alexander"
 building_type_citadel_alexander_01_desc:0 "$citadel_alexander_01_desc$"
 citadel_alexander_01_desc:0 "#F The citadel of Herat stands, so the people say, on the foundations of a fortress built by Alexander when he founded his Alexandria among the Arians. Its great towers of baked brick loom over the bazaars of the city and the orchards of the Hari Rud, and whoever would rule Khorasan must first be master of it.#!"
 building_citadel_alexander_01:0 "$citadel_alexander_01$"
 building_citadel_alexander_01_desc:0 "$citadel_alexander_01_desc$"
 building_type_citadel_alexander_01_duchy:0 "$building_type_citadel_alexander_01$"
 building_type_citadel_alexander_01_duchy_desc:0 "$citadel_alexander_01_desc$"
 building_citadel_alexander_01_duchy:0 "$citadel_alexander_01$"
 building_citadel_alexander_01_duchy_desc:0 "$citadel_alexander_01_desc$"
 citadel_alexander_01_duchy:0 "$citadel_alexander_01$"
 citadel_alexander_01_duchy_desc:0 "$citadel_alexander_01_desc$"
 

 citadel_homs_01:0 "Citadel of Homs"
 building_type_citadel_homs_01:0 "Citadel of Homs"
 building_type_citadel_homs_01_desc:0 "$citadel_homs_01_desc$"
 citadel_homs_01_desc:0 "#F The citadel of Homs crowns a steep mound at the edge of the city, heaped up by the settlements of forgotten ages when this was Emesa, the city of the Sun God whose priests gave Rome an emperor. It commands the gap between the mountains through which the road runs from the desert to the sea.#!"
 building_citadel_homs_01:0 "$citadel_homs_01$"
 building_citadel_homs_01_desc:0 "$citadel_homs_01_desc$"

 citadel_homs_02:0 "Citadel of Homs"
 building_type_citadel_homs_02:0 "Citadel of Homs"
 building_type_citadel_homs_02_desc:0 "$citadel_homs_02_desc$"
 citadel_homs_02_desc:0 "#F Faced with a glacis of stone and crowned with new towers, the mound of Homs has become a fortress to match those of Aleppo and Hama: a keystone in the defense of Syria, holding the road from the coast against every raider.#!"
 building_citadel_homs_02:0 "$citadel_homs_02$"
 building_citadel_homs_02_desc:0 "$citadel_homs_02_desc$"

 sanaa_mosque_01:0 "Great Mosque of Sana'a"
 building_type_sanaa_mosque_01:0 "Great Mosque of Sana'a"
 sanaa_mosque_01_desc:0 "#F The Great Mosque of Sana'a is known to the Islamic World as a true jewel in the desert. The construction of this magnificent mosque was overseen by the Prophet himself in 630 AD, making this one of the oldest centers of Islam in all of Arabia, and a site attractive to all Muslims."
 building_sanaa_mosque_01:0 "$sanaa_mosque_01$"
 building_sanaa_mosque_01_desc:0 "$sanaa_mosque_01_desc$"
 building_type_sanaa_mosque_01_desc:0 "$sanaa_mosque_01_desc$"

 great_mosque_sousse_01:0 "Great Mosque of Susa"
 building_type_great_mosque_sousse_01:0 "Great Mosque of Susa"
 great_mosque_sousse_01_desc:0 "#F Built by the Aghlabid emir Abu al-Abbas Muhammad beside the ribat of Susa, this mosque wears the look of the fortress it was meant to be: thick walls crowned with battlements, round towers at its corners, and no minaret, for the call to prayer is given from the watchtower of the ribat. Within, squat piers and barrel vaults shelter a prayer hall as austere as the warrior-ascetics who guard this coast.#!"
 building_great_mosque_sousse_01:0 "$great_mosque_sousse_01$"
 building_great_mosque_sousse_01_desc:0 "$great_mosque_sousse_01_desc$"
 building_type_great_mosque_sousse_01_desc:0 "$great_mosque_sousse_01_desc$"

 great_mosque_sfax_01:0 "Great Mosque of Sfax"
 building_type_great_mosque_sfax_01:0 "Great Mosque of Sfax"
 great_mosque_sfax_01_desc:0 "#F Founded under the Aghlabids by the qadi Ali ibn Salim, a pupil of the great jurist Sahnun, this mosque was the seed from which Sfax grew: the streets of the city run out from its walls, and its markets press against its gates. The oil of the surrounding olive groves, the wealth of the city, lights its lamps.#!"
 building_great_mosque_sfax_01:0 "$great_mosque_sfax_01$"
 building_great_mosque_sfax_01_desc:0 "$great_mosque_sfax_01_desc$"
 building_type_great_mosque_sfax_01_desc:0 "$great_mosque_sfax_01_desc$"

 mashad_al_husain_01:0 "Mashhad of Ra's al-Hussain" # The extra h for the Ha' letter in arabic
 building_type_mashad_al_husain_01:0 "Mashhad of Ra's al-Hussain"
 mashad_al_husain_01_desc:0 "#F On a hill above Ascalon stands the shrine raised by the Fatimid vizier Badr al-Jamali over the place where, it is said, the head of Husain ibn Ali was found buried, carried from Damascus and hidden here from those who had paraded it. Its carved pulpit is counted among the finest works of the age, and the Isma'ili faithful come from Egypt and beyond to stand before the resting place of the Prophet's grandson.#!"
 building_mashad_al_husain_01:0 "$mashad_al_husain_01$"
 building_mashad_al_husain_01_desc:0 "$mashad_al_husain_01_desc$"
 building_type_mashad_al_husain_01_desc:0 "$mashad_al_husain_01_desc$"

 fatima_masuma_shrine_01:0 "Shrine of Fatima al-Ma'suma"
 building_type_fatima_masuma_shrine_01:0 "Shrine of Fatima al-Ma'suma"
 fatima_masuma_shrine_01_desc:0 "#F In the heart of Qom lies Fatima al-Ma'suma, daughter of the seventh Imam and sister of the eighth, who fell ill on the road to join her brother in Khorasan and was laid to rest here. Renowned in life for her piety and her knowledge of the traditions of her forefathers, in death she has made the city a refuge for the Prophet's household, and scholars and students now gather around her tomb to teach and to learn."
 building_fatima_masuma_shrine_01:0 "$fatima_masuma_shrine_01$"
 building_fatima_masuma_shrine_01_desc:0 "$fatima_masuma_shrine_01_desc$"
 building_type_fatima_masuma_shrine_01_desc:0 "$fatima_masuma_shrine_01_desc$"

 kadhimayn_shrine_01:0 "Shrine of the Kadhimayn"
 building_type_kadhimayn_shrine_01:0 "Shrine of the Kadhimayn"
 kadhimayn_shrine_01_desc:0 "#F Beyond the walls of the Round City, in the old cemetery of the Quraysh, lie two Imams side by side: Musa al-Kadhim, who bore long years in the Caliph's prisons with unbroken patience, and his grandson Muhammad al-Jawad, famed for an open hand and for a wisdom beyond his years. The people of Baghdad call the elder the Gate of Needs, and come to the twin tombs to lay their troubles before him."
 building_kadhimayn_shrine_01:0 "$kadhimayn_shrine_01$"
 building_kadhimayn_shrine_01_desc:0 "$kadhimayn_shrine_01_desc$"
 building_type_kadhimayn_shrine_01_desc:0 "$kadhimayn_shrine_01_desc$"

 jannat_al_baqi_01:0 "Jannat al-Baqi'"
 building_type_jannat_al_baqi_01:0 "Jannat al-Baqi'"
 jannat_al_baqi_01_desc:0 "#F East of the Prophet's Mosque lies al-Baqi', the Garden of the Boxthorn, where the Prophet himself would come by night to pray for those laid to rest in it. Here lie his daughters and his wives, his uncle al-Abbas, his Companions, and four Imams of his line, beneath domes raised by the devotion of later generations."
 building_jannat_al_baqi_01:0 "$jannat_al_baqi_01$"
 building_jannat_al_baqi_01_desc:0 "$jannat_al_baqi_01_desc$"
 building_type_jannat_al_baqi_01_desc:0 "$jannat_al_baqi_01_desc$"

 me_old_mosque_basra_01:0 "Old Mosque of Basrah"
 building_type_old_mosque_basra_01:0 "Old Mosque of Basrah"
 me_old_mosque_basra_01_desc:0 "#F Marked out in reeds by Utba ibn Ghazwan when Basra was still a camp of the conquering armies, and rebuilt in baked brick and teak by Ziyad ibn Abihi, this is among the first mosques raised outside Arabia. Ali ibn Abi Talib preached from its pulpit after the Battle of the Camel, and in its colonnades Hasan al-Basri held the circle from which the grammarians, ascetics, and theologians of the city would spring.#!"
 building_me_old_mosque_basra_01:0 "$me_old_mosque_basra_01$"
 building_me_old_mosque_basra_01_desc:0 "$me_old_mosque_basra_01_desc$"
 building_type_me_old_mosque_basra_01_desc:0 "$me_old_mosque_basra_01_desc$"

 jawatha_mosque_01:0 "Jawatha Mosque"
 building_type_jawatha_mosque_01:0 "Jawatha Mosque"
 jawatha_mosque_01_desc:0 "#F Raised of mud and palm trunks by the Banu Abd al-Qays in the oasis of al-Ahsa, Jawatha is held to be the first mosque of eastern Arabia, and the first in which the Friday prayer was performed after the Prophet's own mosque in Medina. When the tribes around it fell away in the wars of apostasy, its people held firm under siege until relief came from the Caliph.#!"
 building_jawatha_mosque_01:0 "$jawatha_mosque_01$"
 building_jawatha_mosque_01_desc:0 "$jawatha_mosque_01_desc$"
 building_type_jawatha_mosque_01_desc:0 "$jawatha_mosque_01_desc$"

 jameh_mosque_atigh_01:0 "Jameh Mosque of Atigh"
 building_type_jameh_mosque_atigh_01:0 "Jameh Mosque of Atigh"
 building_type_jameh_mosque_atigh_01_desc:0 "#F The old Friday mosque of Shiraz was founded by the Saffarid Amr ibn al-Layth in thanks for a victory, and is the most venerable house of prayer in Fars. Its iwans are dressed in glazed tile and bands of calligraphy, and a cool shabestan beneath its halls gives the faithful refuge from the heat of summer.#!"
 jameh_mosque_atigh_01_desc:0 "#F The old Friday mosque of Shiraz was founded by the Saffarid Amr ibn al-Layth in thanks for a victory, and is the most venerable house of prayer in Fars. Its iwans are dressed in glazed tile and bands of calligraphy, and a cool shabestan beneath its halls gives the faithful refuge from the heat of summer.#!"
 building_jameh_mosque_atigh_01:0 "$jameh_mosque_atigh_01$"
 building_jameh_mosque_atigh_01_desc:0 "$jameh_mosque_atigh_01_desc$"

 juma_mosque_shemakha_01:0 "Juma Mosque of Shemakha"
 building_type_juma_mosque_shemakha_01:0 "Juma Mosque of Shemakha"
 juma_mosque_shemakha_01_desc:0 "#F The Friday mosque of Shemakha is held to be the oldest in the eastern Caucasus after that of Derbent, founded when Maslama ibn Abd al-Malik, brother of the Caliph, carried the arms of Islam against the Khazars. Shaken more than once by the earthquakes that trouble these hills and each time raised again, it remains the heart of Shirvan, whose silk is sold in its shadow.#!"
 building_juma_mosque_shemakha_01:0 "$juma_mosque_shemakha_01$"
 building_juma_mosque_shemakha_01_desc:0 "$juma_mosque_shemakha_01_desc$"
 building_type_juma_mosque_shemakha_01_desc:0 "$juma_mosque_shemakha_01_desc$"

 al_zaytuna_mosque_01:0 "Az-Zaytuna Mosque"
 building_type_al_zaytuna_mosque_01:0 "Az-Zaytuna Mosque"
 al_zaytuna_mosque_01_desc:0 "#F The Mosque of the Olive stands at the heart of Tunis, its hall carried on a forest of columns taken from the ruins of Carthage. Some say it is named for an olive tree that grew where it was founded, others for the oil-sellers at its gates. Around it the markets of the perfumers, booksellers, and cloth merchants have gathered, and beneath its arcades the jurists of the school of Malik teach as they have for generations.#!"
 building_al_zaytuna_mosque_01:0 "$al_zaytuna_mosque_01$"
 building_al_zaytuna_mosque_01_desc:0 "$al_zaytuna_mosque_01_desc$"
 building_type_al_zaytuna_mosque_01_desc:0 "$al_zaytuna_mosque_01_desc$"
 
 building_type_ME_umayyad_mosque_01:0 "The Umayyad Mosque"
 building_type_ME_umayyad_mosque_01_desc:0 "#F Where a temple of Jupiter and then a church of John the Baptist once stood, the Caliph al-Walid raised a mosque to proclaim the glory of his house, and spent the revenue of Syria seven years over to do it. Its walls shimmer with mosaics of gold and green showing rivers, orchards, and palaces without inhabitants, and a shrine within is held by Muslims and Christians alike to guard the head of Yahya, son of Zakariyya.#!"
 building_ME_umayyad_mosque_01:0 "$building_type_ME_umayyad_mosque_01$"
 building_ME_umayyad_mosque_01_desc:0 "$building_type_ME_umayyad_mosque_01_desc$"

 building_type_imam_hussain_shrine_01:0 "Imam Husain Shrine"
 building_type_imam_hussain_shrine_01_desc:0 "#F On the plain of Karbala, within sight of the river whose water was denied him, lies Husain ibn Ali, grandson of the Prophet, who fell on the day of Ashura with his kin and seventy-two companions rather than give his hand to a tyrant. More than once the tomb has been razed and the ground ploughed over it, yet the mourners have always returned, and each year the roads fill with those who come to weep for him."
 building_imam_hussain_shrine_01:0 "$building_type_imam_hussain_shrine_01$"
 building_imam_hussain_shrine_01_desc:0 "$building_type_imam_hussain_shrine_01_desc$"

 building_type_ME_al_qarawiyyin_university_01:0 "Al-Qarawiyyin University"
 building_type_ME_al_qarawiyyin_university_01_desc:0 "#F Founded with the inheritance of Fatima al-Fihri, daughter of a merchant who came to Fez among the exiles of Kairouan, this mosque has grown from the oratory of a single quarter into the foremost seat of learning in the West. Students sit at the feet of its masters to study the law of Malik, grammar, medicine, and the reckoning of the stars, and its library is the pride of the Maghreb.#!"
 building_ME_al_qarawiyyin_university_01:0 "$building_type_ME_al_qarawiyyin_university_01$"
 building_ME_al_qarawiyyin_university_01_desc:0 "$building_type_ME_al_qarawiyyin_university_01_desc$"
 
 building_type_tarikhaneh_mosque_01:0 "Tarikhaneh"
 building_type_tarikhaneh_mosque_01_desc:0 "#F In Damghan, near the old Hecatompylos of the Parthian kings, stands a temple where the sacred fire was tended under the house of Sasan. Its great days are past and its priests are few, yet the massive round pillars still bear the roof, and for those who keep the old faith the hearth is holy still. Such a site will not long escape the notice of a Muslim ruler in want of a mosque.#!"
 building_tarikhaneh_mosque_01:0 "$building_type_tarikhaneh_mosque_01$ Fire Temple Ruins"
 building_tarikhaneh_mosque_01_desc:0 "$building_type_tarikhaneh_mosque_01_desc$"
 building_tarikhaneh_mosque_02:0 "$building_type_tarikhaneh_mosque_01$ Mosque"
 building_tarikhaneh_mosque_02_desc:0 "#F Where the fire of the Magians once burned, the faithful now bow toward Mecca. The Tarikhaneh, the House of God, keeps the plan of the Arab mosques, a square court ringed by arcades, but its thick round piers of baked brick are built as the Sasanians built: the old Persia carrying the new faith upon its shoulders.#!"

 building_type_katasraj_temples_01:0 "Katasraj"
 building_type_katasraj_temples_01_desc:0 "#F Around a pool of deep green water in the Salt Range cluster the shrines of Katas. The pool is said to have formed from the tears of Shiva as he wept inconsolably for his wife Sati, and the Pandava brothers are believed to have sheltered here during their exile. Pilgrims come to bathe in its waters and be cleansed of their sins.#!"
 building_katasraj_temples_01:0 "$building_type_katasraj_temples_01$ Temples"
 building_katasraj_temples_01_desc:0 "$building_type_katasraj_temples_01_desc$"
 building_katasraj_temples_02:0 "$building_type_katasraj_temples_01$ Temple Complex"
 building_katasraj_temples_02_desc:0 "#F With new shrines raised and the old restored, Katas has grown into one of the great pilgrim places of the Punjab. On the night of Shiva the hillside fills with the devout, who descend the steps to the sacred pool by lamplight while the priests chant from the temples above.#!"

 building_type_qalat_bahrain_01:0 "Qal'at al-Bahrain"
 building_type_qalat_bahrain_01_desc:0 "#F On the northern shore of Awal rises a great mound, layer upon layer of cities built each upon the bones of the last, since the days when this was Dilmun, where the ships of Mesopotamia met those of the Indus. A crumbling fort sits atop the mound, looking out over the pearling banks.#!"
 building_qalat_bahrain_01:0 "$building_type_qalat_bahrain_01$ Fortress Ruins"
 building_qalat_bahrain_01_desc:0 "$building_type_qalat_bahrain_01_desc$"
 building_qalat_bahrain_02:0 "$building_type_qalat_bahrain_01$ Fort"
 building_qalat_bahrain_02_desc:0 "#F Restored and regarrisoned, the fortress on the mound once more commands the anchorage of Awal. Whoever holds it holds the sweet-water springs, the date groves, and the pearling fleets of the richest island in the Gulf.#!"

 building_type_qila_baltit_01:0 "Qila Baltit"
 building_type_qila_baltit_01_desc:0 "#F Perched on a spur beneath the glaciers of the Karakoram, Baltit commands the terraced fields of the Hunza valley and the track by which caravans climb toward Kashgar. Built of stone laced with timber in the manner of Tibet, so that it sways and does not fall when the mountains shake, it is the seat from which the lords of the valley exact their due from all who pass.#!"
 building_qila_baltit_01:0 "$building_type_qila_baltit_01$"
 building_qila_baltit_01_desc:0 "$building_type_qila_baltit_01_desc$"

 building_type_gonbad_e_qavus_01:0 "Gonbad-e-Qavus"
 building_type_gonbad_e_qavus_01_desc:0 "#F Rising from the plain of Gurgan like a spear driven into the earth, this tower of baked brick was raised by the Ziyarid prince Qabus ibn Wushmgir, scholar, poet, and tyrant, to be his tomb. It is said that his body hangs in a coffin of glass beneath the roof, where the first light of morning falls upon it through a single window in the east. Travelers can see the tower from a day's ride away.#!"
 building_gonbad_e_qavus_01:0 "$building_type_gonbad_e_qavus_01$"
 building_gonbad_e_qavus_01_desc:0 "$building_type_gonbad_e_qavus_01_desc$"
 
 building_type_mankiala_stupa_01:0 "Mankiala Stupa"
 building_type_mankiala_stupa_01_desc:0 "#F This great dome of stone was raised in the days of the Kushan kings over the place where, as the Jataka tales tell, the Bodhisattva in an earlier life as a prince gave his own body to feed a starving tigress and her cubs. Though the monks who once tended it are few, travelers on the road through the Pothohar still circle it in reverence.#!"
 building_mankiala_stupa_01:0 "$building_type_mankiala_stupa_01$"
 building_mankiala_stupa_01_desc:0 "$building_type_mankiala_stupa_01_desc$"

 building_type_multan_fort_01:0 "Katochgarh"
 building_type_multan_fort_01_desc:0 "#F Raised upon a mound above the old bed of the Ravi, the fortress of Multan is said to have been founded by the Katoch rajas in an age beyond memory. Its ramparts enclose the most sacred ground of the city, where the golden idol of the Sun long drew pilgrims and their offerings from across al-Hind, and where the Arab emirs held that idol hostage against any king who came to besiege them.#!"
 building_multan_fort_01:0 "$building_type_multan_fort_01$"
 building_multan_fort_01_desc:0 "$building_type_multan_fort_01_desc$"

 building_type_prahladpuri_temple_01:0 "Prahladpuri Temple"
 building_type_prahladpuri_temple_01_desc:0 "#F On a mound within the citadel of Multan stands the temple of Prahlada, the prince whose devotion to Vishnu no torment could break. Here, it is told, the Lord burst from a pillar as Narasimha, half man and half lion, to slay the tyrant Hiranyakashipu, and from the burning of the demoness Holika the people trace the fires and colors of Holi.#!"
 building_prahladpuri_temple_01:0 "$building_type_prahladpuri_temple_01$"
 building_prahladpuri_temple_01_desc:0 "$building_type_prahladpuri_temple_01_desc$"

 building_type_chapel_dzordzor_01:0 "Chapel of Dzordzor"
 building_type_chapel_dzordzor_01_desc:0 "#F Hidden in a gorge of the mountains of Artaz, the chapel of the Holy Mother of God is all that many travelers see of Dzordzor. Yet the monastery around it is famed among the Armenians for its school, whose monks labor by lamplight copying and illuminating the scriptures.#!"
 building_chapel_dzordzor_01:0 "$building_type_chapel_dzordzor_01$"
 building_chapel_dzordzor_01_desc:0 "$building_type_chapel_dzordzor_01_desc$"

 building_type_monastery_saint_thaddeus_01:0 "Monastery of Saint Thaddeus"
 building_type_monastery_saint_thaddeus_01_desc:0 "#F The Armenians hold that the apostle Thaddeus, who first brought the Gospel to their land, was martyred and buried on this spot, and that the first church here was raised over his grave. Built of dark stone, the Black Church, as the people call it, stands lonely in the mountains of Artaz, and each summer the faithful gather in tents around it to keep the feast of the saint.#!"
 building_monastery_saint_thaddeus_01:0 "$building_type_monastery_saint_thaddeus_01$"
 building_monastery_saint_thaddeus_01_desc:0 "$building_type_monastery_saint_thaddeus_01_desc$"

 building_type_monastery_saint_stepanos_01:0 "Monastery of Saint Stepanos"
 building_type_monastery_saint_stepanos_01_desc:0 "#F Set in a red gorge above the Araxes, this monastery is said to have been founded by the apostle Bartholomew himself, and is dedicated to Stephen the Protomartyr, first of the seven deacons and first to die for Christ. Its monks are renowned as copyists, painters, and teachers, and their manuscripts are treasured in churches throughout Armenia.#!"
 building_monastery_saint_stepanos_01:0 "$building_type_monastery_saint_stepanos_01$"
 building_monastery_saint_stepanos_01_desc:0 "$building_type_monastery_saint_stepanos_01_desc$"
 

 building_type_port_tyre_01:0 "Ports of Tyre"
 building_type_port_tyre_01_desc:0 "#F Built on an island that Alexander joined to the shore, Tyre shelters its ships in a harbor within the very walls, closed each night by a chain drawn between two towers. The city has grown rich on the purple wrung from the murex, on glass of rare clarity, and on the sugar of its plantations, and merchants call it the gate through which the wealth of Damascus reaches the sea.#!"
 building_port_tyre_01:0 "$building_type_port_tyre_01$"
 building_port_tyre_01_desc:0 "$building_type_port_tyre_01_desc$"

 
 building_type_me_legendary_mosque:0 "Legendary Mosque"
 building_type_me_legendary_mosque_desc:0 "#F Raised by a ruler who wished their piety to be remembered, this mosque has become a wonder spoken of in distant lands. Beneath its soaring dome there is room for thousands to pray shoulder to shoulder, its court is cooled by fountains, and scholars and pilgrims travel for months only to stand within it.#!"
 building_me_legendary_mosque:0 "$building_type_me_legendary_mosque$"
 building_me_legendary_mosque_desc:0 "$building_type_me_legendary_mosque_desc$"
 
 building_type_me_legendary_mosque_ziyadid:0 "The Ziyadi Mosque"
 building_type_me_legendary_mosque_ziyadid_desc:0 "#F Raised by the house of Ziyad in their capital, this mosque and the school within it have become the lamp of the Tihama. Students come from across the Yemen and beyond the sea to study law, grammar, and the reckoning of numbers beneath its arcades, and the fame of its teachers adds luster to the dynasty that built it.#!"
 building_me_legendary_mosque_ziyadid:0 "$building_type_me_legendary_mosque_ziyadid$"
 building_me_legendary_mosque_ziyadid_desc:0 "$building_type_me_legendary_mosque_ziyadid_desc$"
 
 building_type_me_land_of_frankinscense_01:0 "Land of Frankincense"
 building_type_me_land_of_frankinscense_01_desc:0 "The hills of Dhofar, watered by the mists of the summer monsoon, are the one place on earth where the trees that weep the finest frankincense grow in such abundance. The Arabs call it #EMP 'Arḍ al-Lubān#!, and from the anchorage beside the ruins of ancient Sumhuram the resin is shipped to every temple, church, and palace that can afford it."
 building_me_land_of_frankinscense_01:0 "$building_type_me_land_of_frankinscense_01$"
 building_me_land_of_frankinscense_01_desc:0 "$building_type_me_land_of_frankinscense_01_desc$"
 building_me_land_of_frankinscense_02:0 "$building_type_me_land_of_frankinscense_01$"
 building_me_land_of_frankinscense_02_desc:0 "With its harbor deepened and its warehouses rebuilt, the Land of Frankincense has reclaimed its place at the head of the incense road. Most who dwell here live by cutting the bark, gathering the hardened tears, and loading them aboard the ships that wait on the monsoon."
 building_me_land_of_frankinscense_03:0 "$building_type_me_land_of_frankinscense_01$"
 building_me_land_of_frankinscense_03_desc:0 "What was once a modest anchorage among ruins is now a great emporium, and the frankincense of Dhofar perfumes the air from Ireland to Cathay. Camel caravans and ocean fleets alike set their calendars by its harvest, and its lords grow rich on the smoke of other men's prayers."

