l_english:
 sharada_peeth:0 "Sharada Peeth"
 sharada_peeth_desc:0 "#F Where the Madhumati stream meets the Kishanganga stands the seat of Sharada, the goddess of learning whom other lands call Sarasvati. Kashmir itself is named Sharada-desha after her, and its learned men write in the script that bears her name. Kalhana tells how men of Gauda, far to the east, came over the mountains in the guise of pilgrims to her in the days of King Lalitaditya; al-Biruni counts her wooden image among the most venerated idols of al-Hind, visited by pilgrims from every quarter. The Jains remember that when Hemachandra composed his grammar for the king of Gujarat, the old grammars he needed could be found complete only in the goddess's library in Kashmir, and Jonaraja records that Sultan Zayn al-Abidin himself journeyed to the shrine in 1422.#!"
 building_type_sharada_peeth_01:0 "$sharada_peeth$"
 building_type_sharada_peeth_01_desc:0 "$sharada_peeth_desc$"
 sharada_peeth_01:0 "Shrine of Sharada"
 sharada_peeth_01_desc:0 "A spring rises beneath a slab of stone in the valley of the Kishanganga, and over it the Brahmins keep the shrine of Sharada. Pilgrims tell of the sage Shandilya, to whom the goddess showed her true form here, and of the stream that turned to honey and is called Madhumati for it."
 building_sharada_peeth_01:0 "$sharada_peeth_01$"
 building_sharada_peeth_01_desc:0 "$sharada_peeth_01_desc$"
 sharada_peeth_02:0 "Temple of Sharada"
 sharada_peeth_02_desc:0 "A temple of dressed stone now stands over the sacred spring in a walled courtyard, its doorway framed by a trefoil arch in the manner of the great temples of Kashmir. Brahmins teach the Vedas and grammar in its courts, and pilgrims climb the valley from as far as Gauda in the east."
 building_sharada_peeth_02:0 "$sharada_peeth_02$"
 building_sharada_peeth_02_desc:0 "$sharada_peeth_02_desc$"
 sharada_peeth_03:0 "Seat of Sharada"
 sharada_peeth_03_desc:0 "Scholars from every land of Hindustan come to study at the seat of the goddess of learning, and Kashmir's pandits are famed far beyond its mountains. In the temple's keeping lie works of grammar, philosophy, astronomy and poetry, copied on birch bark in the Sharada script, and some of them can be found nowhere else."
 building_sharada_peeth_03:0 "$sharada_peeth_03$"
 building_sharada_peeth_03_desc:0 "$sharada_peeth_03_desc$"
 sharada_peeth_04:0 "Throne of Omniscience"
 sharada_peeth_04_desc:0 "Four doors open on the four quarters of the temple, and within stands the Sarvajna Pitha, the throne of the all-knowing. It is said that only a scholar who has defeated the learned of every school, Nyaya and Mimamsa, Buddhist and Jain, may pass the last door and take the seat, and that the goddess herself questions him before he does. The pandits say that Shankara the great teacher once sat upon it."
 building_sharada_peeth_04:0 "$sharada_peeth_04$"
 building_sharada_peeth_04_desc:0 "$sharada_peeth_04_desc$"
 sharada_peeth_01_district:0 "$sharada_peeth$"
 sharada_peeth_01_district_desc_flavor:0 "$sharada_peeth_desc$"
